<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1524">
<title>冥隼 · 破晓战线 | NEMESIS</title>
<style>
/* ========== 主题与视口 ========== */
:root{
  --bg:#D9DFE8;--panel:#F2F4F8;--panel2:#E2E7EF;--ink:#152033;--dim:#556175;--line:#C2CBD8;
  --ally:#2F74E0;--enemy:#D23A33;--gold:#C98F00;--en:#1C9FB3;--hp:#2FA86B;
  --disp:'ZCOOL QingKe HuangYou',"PingFang SC","Microsoft YaHei",sans-serif;
  --W:100vw;--H:100vh;--cell:44px;--side:240px;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root.rot{--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px);--st:0px;--sb:0px}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524;--panel:#18233A;--panel2:#233049;--ink:#E8EDF5;--dim:#93A0B5;--line:#31405C;
    --ally:#4A8DFF;--enemy:#EF4B43;--gold:#FFC93C;--en:#39C6D9;--hp:#3CCB84;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524;--panel:#18233A;--panel2:#233049;--ink:#E8EDF5;--dim:#93A0B5;--line:#31405C;
  --ally:#4A8DFF;--enemy:#EF4B43;--gold:#FFC93C;--en:#39C6D9;--hp:#3CCB84;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#05080F;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* 舞台：竖屏时整体旋转 90°，横屏时铺满 */
#stage{position:fixed;left:0;top:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--bg)}
.rot #stage{left:100vw;transform:rotate(90deg);transform-origin:0 0}

/* ========== 地图界面 ========== */
#app{position:absolute;inset:0;display:flex;padding:var(--st) var(--sr) var(--sb) var(--sl)}
#wrap{flex:1;min-width:0;display:grid;place-items:center;padding:8px;
  background:radial-gradient(ellipse at 50% 50%,rgba(74,141,255,.08),transparent 70%)}
#board{position:relative;width:calc(var(--cell) * 12);height:calc(var(--cell) * 8);border-radius:8px;overflow:hidden;
  box-shadow:0 0 0 2px var(--line),0 10px 28px rgba(0,0,0,.3)}
#terrain{position:absolute;inset:0;width:100%;height:100%;display:block}
#tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,var(--cell));grid-auto-rows:var(--cell)}
.tile{position:relative;cursor:pointer}
.tile::after{content:'';position:absolute;inset:2px;border-radius:5px;pointer-events:none}
.tile.mv::after{background:rgba(74,141,255,.42);box-shadow:inset 0 0 0 1px rgba(210,230,255,.85)}
.tile.atk::after{background:rgba(239,75,67,.26)}
.tile.threat::after{background:rgba(239,75,67,.3);box-shadow:inset 0 0 0 1px rgba(255,190,185,.45)}
.tile.danger::after{background:repeating-linear-gradient(135deg,rgba(239,75,67,.32) 0 4px,rgba(239,75,67,.14) 4px 8px)}
.tile.tgt::after{background:rgba(239,75,67,.58);box-shadow:inset 0 0 0 2px #FFD6D3;animation:pulse 1s ease-in-out infinite}
.tile.sel::before{content:'';position:absolute;inset:1px;border:2px solid #FFC93C;border-radius:6px;z-index:1}
.tile.look::before{content:'';position:absolute;inset:1px;border:2px dashed rgba(255,255,255,.8);border-radius:6px;z-index:1}
@keyframes pulse{50%{opacity:.5}}
#units{position:absolute;inset:0;pointer-events:none}
.unit{position:absolute;left:calc(var(--x) * var(--cell));top:calc(var(--y) * var(--cell));width:var(--cell);height:var(--cell);
  transition:left .085s linear,top .085s linear}
.unit .base{position:absolute;left:6%;right:6%;bottom:3%;height:26%;border-radius:50%}
.unit.ally .base{background:radial-gradient(ellipse at center,rgba(120,180,255,.95) 0,rgba(60,130,255,.55) 40%,transparent 70%)}
.unit.enemy .base{background:radial-gradient(ellipse at center,rgba(255,120,100,.95) 0,rgba(230,60,50,.5) 40%,transparent 70%)}
.unit img{position:absolute;left:-24%;top:-42%;width:148%;height:148%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.55));
  animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.unit.boss img{left:-40%;top:-66%;width:180%;height:180%}
.unit.acted img{filter:grayscale(.85) brightness(.6);animation:none}
.unit .hp{position:absolute;left:14%;right:14%;bottom:1px;height:4px;background:rgba(0,0,0,.65);border-radius:2px;overflow:hidden}
.unit .hp i{display:block;height:100%;transition:width .4s}
.unit .badge{position:absolute;right:-2px;top:-4px;z-index:2;font-size:10px;color:#1A1000;background:#FFC93C;border-radius:50%;width:14px;height:14px;display:grid;place-items:center;box-shadow:0 1px 3px #0008}
.unit.dead{animation:die .5s ease-in forwards}
.unit.lunge img{filter:brightness(1.8)}
.unit.warp{animation:warpOut .7s ease-in forwards}
.unit.warpin img{animation:warpIn .7s ease-out}
@keyframes warpOut{to{opacity:0;transform:translateY(-34px) scaleY(1.6);filter:brightness(3)}}
@keyframes warpIn{from{opacity:0;transform:translateY(-30px) scaleY(1.6);filter:brightness(3)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes die{to{opacity:0;transform:scale(1.4);filter:brightness(3)}}
#labels{position:absolute;inset:0;pointer-events:none;z-index:40}
#labels .tl{position:absolute;left:calc((var(--x) + .5) * var(--cell));top:calc(var(--y) * var(--cell) - 2px);transform:translateX(-50%);
  background:rgba(200,30,30,.9);border-radius:4px;padding:0 4px;line-height:15px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.pop{position:absolute;left:calc(var(--x) * var(--cell));top:calc(var(--y) * var(--cell));width:var(--cell);text-align:center;
  font-family:var(--disp);font-size:18px;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000;z-index:50;pointer-events:none;
  animation:popup .9s ease-out forwards;white-space:nowrap}
.pop.crit{color:#FFC93C}.pop.miss{color:#BFE3FF;font-size:15px}
@keyframes popup{0%{opacity:0;transform:translateY(6px) scale(1.4)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-22px)}}
.sburst{position:absolute;left:calc((var(--x) + .5) * var(--cell));top:calc((var(--y) + .4) * var(--cell));z-index:60;pointer-events:none;
  transform:translate(-50%,-50%);font-family:var(--disp);font-size:calc(var(--cell) * .9);color:#FFE27A;white-space:nowrap;
  text-shadow:0 0 6px #FF8A00,0 0 14px #FF5A00,0 2px 0 #3A1800;animation:sburst 1s ease-out forwards}
.sburst::before{content:'';position:absolute;left:50%;top:50%;width:calc(var(--cell) * 2.4);height:calc(var(--cell) * 2.4);transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(255,226,122,.6),rgba(255,120,0,0) 65%);z-index:-1}
@keyframes sburst{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1.1)}}

/* ========== 右侧面板 ========== */
#side{width:var(--side);flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#top{flex:none;padding:8px 10px 6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.turn{display:flex;flex-direction:column;gap:2px;min-width:0}
.turn>div{display:flex;align-items:center;gap:8px}
.turn small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn b{font-family:var(--disp);font-weight:400;font-size:20px;white-space:nowrap;line-height:1}
.phase{font-size:11px;padding:2px 7px;border-radius:3px;color:#fff;white-space:nowrap}
.phase.ally{background:var(--ally)}.phase.enemy{background:var(--enemy)}
.tb{display:flex;gap:5px}
.tbtn{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 4px;font-size:12px;white-space:nowrap}
.tbtn.on{background:var(--enemy);border-color:transparent;color:#fff}
.tbtn.end{background:var(--gold);border-color:transparent;color:#1A1400;font-weight:700}
.tbtn:disabled{opacity:.4}
.tbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#panel{flex:1;min-height:0;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
#endbar{flex:none;display:flex;gap:6px;padding:6px 10px 8px;border-top:1px solid var(--line)}
#endbar .tbtn{padding:8px 4px;font-size:13px}
#endbar .tbtn.end{flex:1.4}
.card{display:flex;gap:8px}
.por{width:52px;height:52px;flex:none;border-radius:8px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 60%,#2A3E66,#121A2C)}
.por.enemy{background:radial-gradient(circle at 50% 60%,#5E2230,#1C0C12)}
.por img{position:absolute;inset:0;width:100%;height:100%}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.nm b{font-family:var(--disp);font-weight:400;font-size:19px;line-height:1}
.nm span{color:var(--dim);font-size:11px}
.tag{font-size:10.5px!important;padding:0 5px;border-radius:3px;background:var(--gold);color:#1A1400!important}
.bar{position:relative;height:13px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp)}
.bar.en i{background:var(--en)}
.bar em{position:relative;font-style:normal;font-size:10px;padding-left:5px;line-height:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats{display:flex;gap:4px 10px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.stats b.hot{color:var(--gold)}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.cmds.row{display:flex}
.cmd{flex:1;border:none;padding:9px 6px;font-size:15px;font-family:var(--disp);color:#fff;background:var(--ally);
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.cmd.alt{background:var(--panel2);color:var(--ink)}
.cmd.gold{background:var(--gold);color:#1A1400}
.cmd.red{background:var(--enemy)}
.cmd:disabled{opacity:.35}
.cmd:focus-visible{filter:brightness(1.25);text-decoration:underline}
.cmd.big{flex:none;width:min(280px,100%);padding:13px;font-size:21px}
.tip{grid-column:1/-1;font-size:12px;color:var(--dim)}
.tip b{color:var(--ink)}
.hint{display:flex;flex-direction:column;gap:8px;color:var(--dim);font-size:12.5px;line-height:1.6}
.hint p{margin:0}
.hint .big{font-family:var(--disp);font-size:24px;color:var(--ink)}
.hint .goal{font-size:12.5px;color:var(--ink)}.hint .goal b{font-family:var(--disp);font-weight:400;color:var(--gold);margin-right:4px}
.count{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.count .ca{color:var(--ally)}.count .ce{color:var(--enemy)}
.terr{display:flex;gap:10px;align-items:center}
.terr canvas{width:52px;height:52px;border-radius:8px;flex:none}
.terr b{font-family:var(--disp);font-weight:400;font-size:20px;display:block;color:var(--ink)}
.terr span{font-size:12px}

/* ========== 浮层（右侧抽屉） ========== */
#sheetBack{position:absolute;inset:0;background:rgba(5,10,20,.4);z-index:65}
#sheet{position:absolute;right:calc(var(--sr) + 8px);top:calc(var(--st) + 8px);bottom:calc(var(--sb) + 8px);width:min(470px,calc(var(--W) * .58));overflow:auto;
  background:var(--panel);color:var(--ink);border-radius:14px;padding:14px 14px 12px;z-index:66;box-shadow:-10px 0 30px rgba(0,0,0,.35);animation:sheetin .2s ease-out}
@keyframes sheetin{from{transform:translateX(30px);opacity:0}}
#sheet h3{margin:0 0 8px;font-weight:400;font-size:22px;font-family:var(--disp)}
#sheet h4{margin:12px 0 4px;font-size:13px}
#sheet p{margin:4px 0;line-height:1.65;font-size:13.5px}
#sheet .sub{margin:-4px 0 8px;color:var(--dim);font-size:12.5px}
#sheet .cmds{margin-top:8px;display:flex}
.wrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;color:var(--ink);margin-bottom:6px}
.wrow .wn{font-size:14px;font-weight:600}
.wrow .wp{font-size:20px;text-align:right;line-height:1;font-family:var(--disp)}
.wrow .wm{grid-column:1/-1;font-size:11.5px;color:var(--dim)}
.wrow .why{color:var(--enemy)}
.wrow:disabled{opacity:.5}
.wrow:focus-visible{outline:2px solid var(--gold)}
.fc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin:4px 0 8px}
.fcol{background:var(--panel2);border-radius:10px;padding:9px;border-top:4px solid var(--ally);min-width:0}
.fcol.enemy{border-top-color:var(--enemy)}
.fcol .n{font-family:var(--disp);font-size:19px}
.fcol .n small{font-family:inherit;font-size:11px;color:var(--dim)}
.fcol .r{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--dim);margin-top:3px}
.fcol .r b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.fcol .big{font-family:var(--disp);font-size:30px;line-height:1.1;margin-top:4px}
.fcol .big small{font-size:12px;color:var(--dim);margin-left:4px}
.vs{align-self:center;font-family:var(--disp);font-size:20px;color:var(--gold)}
.kill{color:var(--enemy)!important}
.win{color:var(--hp)}.lose{color:var(--enemy)}
.threatc{display:flex;gap:6px;margin-bottom:4px}.threatc div{flex:1;background:var(--panel2);border-radius:10px;padding:6px 9px;border-top:3px solid var(--enemy)}
.threatc span{display:block;font-size:11px;color:var(--dim)}.threatc b{font-family:var(--disp);font-weight:400;font-size:22px}
.ccx{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}.ccx .wrow{margin:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.seg{display:flex;background:var(--panel2);border-radius:9px;padding:3px;gap:2px}
.segb{border:none;background:transparent;color:var(--dim);padding:5px 11px;border-radius:7px;font-size:12.5px;white-space:nowrap}
.segb.on{background:var(--ally);color:#fff}
.dt{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;align-items:center;position:relative}
.dtp{width:64px;height:64px;border-radius:10px}
.dtm{position:absolute;right:-10px;top:-30px;width:110px;height:110px;opacity:.32;pointer-events:none;z-index:0}
.dti{position:relative;z-index:1}.dti h3{margin:0!important}
.dst{display:grid;grid-template-columns:repeat(3,auto);gap:2px 12px;font-size:12px;color:var(--dim);margin-top:4px}.dst b{color:var(--ink);font-variant-numeric:tabular-nums}
.dw{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.dw b{color:var(--ink);font-weight:600}
.dsp{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.dsp span{font-size:11px;padding:2px 7px;border-radius:3px;background:rgba(255,255,255,.08);color:#7C889C}
.dsp span.on{background:#FFC93C;color:#1A1000}
#sheet .dsp span{background:var(--panel2);color:var(--dim)}#sheet .dsp span.on{background:var(--gold);color:#1A1000}

#toast{position:absolute;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-8px);background:linear-gradient(90deg,#3A2A00,#7A5600);color:#FFE6A0;
  border:1px solid #FFC93C;padding:7px 18px;border-radius:20px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.banner{position:absolute;left:0;right:0;top:40%;z-index:35;pointer-events:none;opacity:0;padding:12px 0 10px;text-align:center;color:#fff}
.banner.ally{background:linear-gradient(90deg,transparent,rgba(47,116,224,.94) 18% 82%,transparent)}
.banner.enemy{background:linear-gradient(90deg,transparent,rgba(190,40,40,.94) 18% 82%,transparent)}
.banner .bt{font-family:var(--disp);font-size:36px;line-height:1.1}
.banner .bs{font-size:13px;opacity:.9;margin-top:4px}
.banner.show{animation:bn 1.25s ease forwards}
@keyframes bn{0%{opacity:0;transform:translateX(-40%)}18%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40%)}}

/* ========== 战斗画面 ========== */
#battle{position:absolute;inset:0;z-index:50;background:#05080F;color:#fff;touch-action:none;transition:opacity .22s ease}
#bc{position:absolute;inset:0;width:100%;height:100%;display:block}
.bhud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr 1fr;gap:40px;
  padding:calc(8px + var(--st)) calc(14px + var(--sr)) 10px calc(14px + var(--sl));background:linear-gradient(#05080Fdd,#05080F00);z-index:2;pointer-events:none}
.bs2 .bnm{display:flex;gap:6px;align-items:baseline}
.bs2 b{font-family:var(--disp);font-weight:400;font-size:19px;text-shadow:0 2px 4px #000}
.bs2 span{font-size:11px;opacity:.75}
.bs2.R{text-align:right}.bs2.R .bnm{justify-content:flex-end}
.bbar{height:9px;background:#1E2840;margin-top:4px;overflow:hidden;transform:skewX(-20deg);display:flex;box-shadow:0 0 0 1px #0008}
.bs2.R .bbar{transform:skewX(20deg);justify-content:flex-end}
.bs2.L .bbar{border-left:4px solid #4A8DFF}.bs2.R .bbar{border-right:4px solid #EF4B43}
.bbar i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bhp{font-size:10.5px;font-variant-numeric:tabular-nums;opacity:.85;margin-top:3px}
.bskip{position:absolute;right:calc(12px + var(--sr));bottom:calc(10px + var(--sb));z-index:3;background:rgba(10,14,26,.6);color:#fff;
  border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:5px 12px;font-size:12px}
#safeProbe{position:absolute;left:0;bottom:0;width:0;height:0;padding:var(--st) var(--sr) var(--sb) var(--sl);pointer-events:none;visibility:hidden}

/* ========== 对话与章节卡 ========== */
.talk{position:absolute;inset:0;z-index:55;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(rgba(4,8,16,0) 35%,rgba(4,8,16,.85));padding:0 calc(12px + var(--sr)) calc(10px + var(--sb)) calc(12px + var(--sl));cursor:pointer}
.tk-skip{position:absolute;right:calc(12px + var(--sr));top:calc(10px + var(--st));background:rgba(10,14,26,.7);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:5px 14px;font-size:12px}
.tk-box{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end;max-width:820px;width:100%;margin:0 auto}
.tk-por{width:clamp(76px,calc(var(--H) * .3),130px);aspect-ratio:1;border-radius:12px;overflow:hidden;border:3px solid #4A8DFF;box-shadow:0 8px 20px #000a;margin-bottom:4px}
.talk.enemy .tk-por{border-color:#EF4B43}
.tk-por img{width:100%;height:100%;display:block}
.tk-por.shake{animation:tkshake .4s linear}
@keyframes tkshake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
.tk-body{position:relative;background:rgba(8,12,24,.94);border:1px solid #4A8DFF;border-radius:12px;padding:12px 14px 16px;min-height:84px;color:#EEF3FA}
.talk.enemy .tk-body{border-color:#EF4B43}
.tk-name{display:inline-block;font-family:var(--disp);font-size:16px;background:#4A8DFF;color:#fff;padding:2px 12px;margin:-24px 0 6px -4px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}

.menu{display:flex;flex-direction:column;gap:9px;align-items:center;width:100%}

/* 玩法补充 */

.mapring{position:absolute;left:calc((var(--x) + .5) * var(--cell));top:calc((var(--y) + .5) * var(--cell));width:calc((var(--r) * 2 + 1) * var(--cell));height:calc((var(--r) * 2 + 1) * var(--cell));
  transform:translate(-50%,-50%) scale(.1);border-radius:50%;z-index:45;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.9) 0,rgba(200,110,255,.75) 25%,rgba(70,10,120,.6) 55%,rgba(30,0,60,0) 72%);animation:mapring .9s ease-out forwards}

@keyframes bshake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}

  <h1 style="font-size:32px;margin:16px 0">冥隼 · 破晓战线</h1>
  <p id="boot-status" style="line-height:1.8;color:#b6c3da">正在启动游戏。若此页面一直不变，当前文件预览可能没有执行游戏脚本。</p>
  <noscript><p style="color:#ffd197;line-height:1.8">当前预览没有运行 JavaScript，无法进入游戏。请使用在线网页入口；重复打开这个附件不会解决问题。</p></noscript>
  <p style="line-height:1.8;color:#b6c3da">请通过浏览器打开在线版。电脑用户也可将 HTML 保存后，用浏览器打开本地文件。</p>
  <pre id="boot-error" style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#ffd197;max-height:30vh;overflow:auto"></pre>
 </div>
</section>
<script>
(function () {
 var completed=false;
 function show(message) {
  var panel=document.getElementById('boot-guard');
  if(panel)panel.style.display='flex';
  var status=document.getElementById('boot-status');
  if(status)status.textContent=completed?'游戏运行遇到错误。请保留以下信息。':'游戏启动失败。请保留以下错误信息。';
  var details=document.getElementById('boot-error');
  if(details)details.textContent=String(message).slice(0,1600);
 }
 window.addEventListener('error',function(e){if(e.message)show(e.message+'\n行号：'+e.lineno);});
 window.addEventListener('unhandledrejection',function(e){show(e.reason&&e.reason.message?e.reason.message:e.reason);});
 window.__nemesisReady=function(){completed=true;var e=document.getElementById('boot-guard');if(e)e.style.display='none';};
 setTimeout(function(){if(!completed)show('初始化超过 12 秒；请使用浏览器网页入口，或检查页面给出的具体错误。');},12000);
})();
</script>

let GHOST=null,OUTL=0,LS=[.42,-.9],LD=null,BBX=null,OLW=3.4;
const PC=new Map();
function PP(d){
  if(d instanceof Path2D)return {p:d,b:null};
  let o=PC.get(d);
  if(!o){
    const n=(d.replace(/A[^A-Za-z]*/g,'').match(/-?\d*\.?\d+/g)||[]).map(Number);
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(let i=0;i+1<n.length;i+=2){x0=Math.min(x0,n[i]);x1=Math.max(x1,n[i]);y0=Math.min(y0,n[i+1]);y1=Math.max(y1,n[i+1]);}
    o={p:new Path2D(d),b:[x0,y0,x1,y1]};PC.set(d,o);
  }
  return o;
}
/* 把世界空间的光照方向换算到当前零件的局部坐标 */
function ldir(c){
  const m=c.getTransform(),det=m.a*m.d-m.b*m.c;if(!det)return [0,-1];
  const lx=(m.d*LS[0]-m.c*LS[1])/det,ly=(-m.b*LS[0]+m.a*LS[1])/det,n=Math.hypot(lx,ly)||1;
  return [lx/n,ly/n];
}
/* 赛璐璐着色：沿光照方向的硬边渐变（亮边 / 基色 / 暗部），再描线 */
function bbAdd(c,b){
  const m=c.getTransform();
  for(const [x,y] of [[b[0],b[1]],[b[2],b[1]],[b[0],b[3]],[b[2],b[3]]]){
    const px=m.a*x+m.c*y+m.e,py=m.b*x+m.d*y+m.f;
    if(px<BBX[0])BBX[0]=px;if(py<BBX[1])BBX[1]=py;if(px>BBX[2])BBX[2]=px;if(py>BBX[3])BBX[3]=py;
  }
}
function plate(c,d,col,o={}){
  const q=PP(d);
  if(BBX){bbAdd(c,o.g||q.b||[-8,-8,8,8]);return;}
  if(GHOST){c.fillStyle=GHOST;c.fill(q.p);return;}
  if(OUTL){if(o.ol===false)return;const bb=o.g||q.b;if(bb&&Math.min(bb[2]-bb[0],bb[3]-bb[1])<4.5)return;c.lineJoin='round';c.lineWidth=OUTL;c.strokeStyle=OUT;c.stroke(q.p);return;}
  const b=o.g||q.b||[-8,-8,8,8],cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,hw=(b[2]-b[0])/2,hh=(b[3]-b[1])/2;
  const [lx,ly]=LD||ldir(c),e=Math.abs(lx)*hw+Math.abs(ly)*hh||1;
  const g=c.createLinearGradient(cx+lx*e,cy+ly*e,cx-lx*e,cy-ly*e);

  c.strokeStyle=OUT;c.lineWidth=o.lw||1.1;c.lineJoin='round';c.stroke(q.p);
}

const GC=new Map(),DUMMY=document.createElement('canvas').getContext('2d');
const BUCKETS=[1,1.5,2.2,3.2,4.6,6.6];
function bucketFor(s){for(const b of BUCKETS)if(b>=s*.94)return b;return BUCKETS[BUCKETS.length-1];}
function grp(c,key,fn){
  const m=c.getTransform(),s=Math.hypot(m.a,m.b),b=bucketFor(s),k=key+'|'+(GHOST||'n')+'|'+b+'|'+OLW;

    if(bb[0]>bb[2]){GC.set(k,e={cv:null});}

      const pad=OLW+1,ww=bb[2]-bb[0]+pad*2,hh=bb[3]-bb[1]+pad*2;
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.ceil(ww*b));cv.height=Math.max(1,Math.ceil(hh*b));

  if(BE.follow){const f=BE.follow,p=f.pt?ptOf(f.a,f.pt):null,k=1-Math.pow(1-f.k,Math.max(dt,0)/16.7);
    BE.cam.x+=((p?p.x:f.a.x)+(f.ox||0)-BE.cam.x)*k;if(p)BE.cam.y+=(p.y+(f.oy||0)-BE.cam.y)*k;}
  BE.shake*=Math.pow(.0025,s);BE.punch*=Math.pow(.0005,s);if(BE.shake<.3)BE.shake=0;
  BE.flash=Math.max(0,BE.flash-dt/220);BE.invert=Math.max(0,BE.invert-real);
  BE.bgScroll+=BE.speedL*BE.speedDir*s*900;
  for(const l of BE.sl){l.x-=BE.speedDir*l.v*s;if(l.x<-l.len-50)l.x=BE.W+rnd(0,200);if(l.x>BE.W+l.len+50)l.x=-rnd(0,200);}
  for(let i=BE.parts.length-1;i>=0;i--){
    const p=BE.parts[i];p.age+=dt;if(p.age>=p.life){BE.parts.splice(i,1);continue;}
    if(p.drag){const f=Math.exp(-p.drag*s);p.vx*=f;p.vy*=f;}
    p.vy+=(p.grav||0)*s;p.x+=p.vx*s;p.y+=p.vy*s;if(p.grow)p.size+=p.grow*s;if(p.spin)p.rot+=p.spin*s;
    if(p.home){const dx=p.home.x-p.x,dy=p.home.y-p.y;p.x+=dx*Math.min(1,s*p.hk);p.y+=dy*Math.min(1,s*p.hk);}
  }
  for(let i=BE.projs.length-1;i>=0;i--){
    const q=BE.projs[i];q.age+=dt;
    if(q.t==='bullet'){
      q.x+=q.vx*s;q.y+=q.vy*s;
      if(q.cb&&((q.tx-q.x)*q.vx+(q.ty-q.y)*q.vy)<=0){q.cb();q.cb=null;q.dead=true;}
      if(q.age>1400)q.dead=true;
    }else if(q.t==='missile'){
      if(q.age>130){const want=Math.atan2(q.ty-q.y,q.tx-q.x);let cur=Math.atan2(q.vy,q.vx),d=want-cur;
        while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;cur+=clamp(d,-q.turn*s,q.turn*s);
        q.sp=Math.min(q.max,q.sp+2400*s);q.vx=Math.cos(cur)*q.sp;q.vy=Math.sin(cur)*q.sp;}
      q.x+=q.vx*s;q.y+=q.vy*s;q.tt+=dt;
      if(q.tt>16){q.tt=0;part({t:'smoke',x:q.x,y:q.y,vx:rnd(-20,20),vy:rnd(-30,0),life:rnd(500,800),size:rnd(4,7),grow:22,c:'200,200,210',a:.55});
        part({t:'glow',x:q.x,y:q.y,vx:0,vy:0,life:90,size:10,col:'#FFB050'});}
      if(Math.hypot(q.tx-q.x,q.ty-q.y)<22||q.age>2600){q.cb&&q.cb();q.dead=true;}
    }else if(q.t==='shell'){
      q.vy+=900*s;q.x+=q.vx*s;q.y+=q.vy*s;q.tt+=dt;
      if(q.tt>20){q.tt=0;part({t:'smoke',x:q.x,y:q.y,vx:0,vy:0,life:500,size:5,grow:18,c:'170,160,150',a:.45});}
      if(q.age>=q.T){q.cb&&q.cb();q.dead=true;}
    }
    if(q.dead)BE.projs.splice(i,1);
  }
  for(let i=BE.beams.length-1;i>=0;i--){const b=BE.beams[i];b.age+=dt;if(b.dead)BE.beams.splice(i,1);}
  for(let i=BE.arcs.length-1;i>=0;i--){const a=BE.arcs[i];a.age+=dt;if(a.age>a.dur)BE.arcs.splice(i,1);}
  BE.texts=BE.texts.filter(t=>!t.dead);BE.nums=BE.nums.filter(n=>BE.t-n.t0<1500);
}

/* ---------- 特效生成 ---------- */
function sparks(x,y,n,dir,col='#FFE08A',spd=950){
  for(let i=0;i<n;i++){const ang=(dir>0?0:Math.PI)+rnd(-1.2,1.2),v=spd*rnd(.3,1.1);
    part({t:'spark',x,y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v-120,life:rnd(220,480),size:rnd(1.4,3.2),col,drag:3.2,grav:700});}
}
function flashAt(x,y,size,col='#FFE9B0',life=180){part({t:'glow',x,y,vx:0,vy:0,life,size,col});}
function boom(x,y,sc=1,col='#FF9A3C'){
  flashAt(x,y,120*sc,'#FFF2C8',220);flashAt(x,y,80*sc,col,420);
  for(let i=0;i<Math.round(10*sc)+4;i++){const a=rnd(0,6.3),v=rnd(40,220)*sc;
    part({t:'fire',x:x+rnd(-8,8)*sc,y:y+rnd(-8,8)*sc,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:rnd(300,620),size:rnd(18,34)*sc,grow:60*sc,col:pick(['#FF8A2A','#FFB84A','#FF5A1A']),drag:2.5});}
  for(let i=0;i<Math.round(8*sc)+2;i++){const a=rnd(0,6.3),v=rnd(20,120)*sc;
    part({t:'smoke',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,life:rnd(700,1300),size:rnd(14,24)*sc,grow:40*sc,c:'52,48,56',a:.6,drag:1.5});}
  sparks(x,y,Math.round(14*sc),Math.random()<.5?1:-1,'#FFD27A',1100*Math.sqrt(sc));
  for(let i=0;i<Math.round(5*sc);i++)part({t:'debris',x,y,vx:rnd(-400,400)*sc,vy:rnd(-500,-100)*sc,life:rnd(600,1000),size:rnd(3,6)*Math.sqrt(sc),rot:rnd(0,6),spin:rnd(-12,12),grav:900});
  part({t:'ring',x,y,vx:0,vy:0,life:420,size:10,grow:420*sc,col:'#FFE0A0',w:6*sc});
  BE.shake=Math.max(BE.shake,9*sc);
}
function hitFx(D,p,dir,sc=1,col='#FFE08A'){
  D.flash=Math.max(D.flash,Math.min(.85,.12+.5*sc));flashAt(p.x,p.y,70*sc,'#FFFFFF',140);flashAt(p.x,p.y,50*sc,col,260);
  sparks(p.x,p.y,Math.round(16*sc),dir,col);
  part({t:'ring',x:p.x,y:p.y,vx:0,vy:0,life:260,size:6,grow:380*sc,col,w:4*sc});
  BE.shake=Math.max(BE.shake,7*sc);BE.punch=Math.max(BE.punch||0,.05*Math.min(sc,1.6));
}
function muzzleFlash(x,y,dir,sc=1){flashAt(x,y,34*sc,'#FFE7A0',70);sparks(x,y,3,dir,'#FFE7A0',500);}
function chargeFx(x,y,col,k){
  for(let i=0;i<3;i++){const a=rnd(0,6.3),r=rnd(50,110);
    part({t:'glow',x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:0,vy:0,life:260,size:rnd(5,9),col,home:{x,y},hk:9});}
  flashAt(x,y,(18+k*40)*rnd(.9,1.1),col,70);
}
function bullet(x,y,tx,ty,sp,cb,col='#FFE08A'){
  const d=Math.hypot(tx-x,ty-y)||1;BE.projs.push({t:'bullet',x,y,tx,ty,vx:(tx-x)/d*sp,vy:(ty-y)/d*sp,cb,col,age:0});
}
function missile(x,y,dir,tx,ty,cb){
  BE.projs.push({t:'missile',x,y,tx,ty,vx:-dir*rnd(80,260),vy:-rnd(320,560),sp:420,max:1500,turn:8,cb,age:0,tt:0});
}
function shell(x,y,tx,ty,T,cb){BE.projs.push({t:'shell',x,y,vx:(tx-x)/(T/1000),vy:(ty-y)/(T/1000)-.5*900*(T/1000),T,cb,age:0,tt:0});}
function beam(x1,y1,x2,y2,w,col){const b={x1,y1,x2,y2,w,col,grow:0,alpha:1,follow:null,age:0};BE.beams.push(b);return b;}
function fadeBeam(b,ms=260){tween(b,{alpha:0},ms,'linear').then(()=>{b.dead=true;});}
function slashArc(cx,cy,r,a0,a1,w,col,dur=340){BE.arcs.push({cx,cy,r,a0,a1,w,col,age:0,dur});}
function arcFor(A,D,dir,sc=1,col,rev=false){
  const c=chestOf(D),cx=c.x-dir*46*sc,cy=c.y-6;
  let a0=dir>0?-110:-70,a1=dir>0?45:225;
  if(rev){const t=a0;a0=a1;a1=t;}
  slashArc(cx,cy,84*sc,a0*R,a1*R,28*sc,col);
}
function showTitle(text,side,ult,tag){BE.texts=BE.texts.filter(t=>t.k!=='title');BE.texts.push({k:'title',text,side,ult,tag,t0:BE.t,dur:ult?2200:1500});}
function showLine(pid,line,side,exp='normal'){BE.texts=BE.texts.filter(t=>t.k!=='line');BE.texts.push({k:'line',pid,name:PILOTS[pid].name,line,side,exp,t0:BE.t,dur:2600});}
function showNum(D,o){const c=chestOf(D);BE.nums.push(Object.assign({x:c.x,y:c.y-50,t0:BE.t},o));}

/* ---------- 渲染 ---------- */
const SKY={ally:['#06112A','#1B4488','#5C9AD6','#F4C895'],enemy:['#10040A','#4E1224','#A8403E','#F29C66']};
const GRD={ruin:['#5E5A52','#22201C'],plain:['#56733F','#223319'],forest:['#355A2E','#12220F'],mount:['#6E5C44','#2A2118'],water:['#2A5E84','#0B2238']};
function hills(c,y0,amp,par,col,seed,step=10,jag=0){
  const cx=(BE.cam.x+BE.bgScroll)*par*BE.cam.z;
  c.fillStyle=col;c.beginPath();c.moveTo(0,BE.H);
  for(let sx=0;sx<=BE.W+step;sx+=step){const wx=(sx+cx)/60+seed;
    let h=Math.sin(wx*.9)*.5+Math.sin(wx*.37+1.3)*.8+Math.sin(wx*2.1+seed)*.18;
    if(jag)h+=Math.abs(Math.sin(wx*3.3+seed))*jag;
    c.lineTo(sx,y0-amp*(1.2+h));}
  c.lineTo(BE.W,BE.H);c.closePath();c.fill();
}
function drawBG(c){
  const W=BE.W,H=BE.H,z=BE.cam.z;
  const hy=clamp(BE.H*.5+(40-BE.cam.y)*z,H*.22,H*.94);
  if(BE.cutBg>0){
    const side=BE.side==='enemy';
    const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,side?'#2A0610':'#061434');g.addColorStop(.5,side?'#8C1C2C':'#1E56B8');g.addColorStop(1,side?'#1A040A':'#040C22');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    c.save();c.globalAlpha=.16;c.fillStyle='#fff';const off=(BE.t*.4)%80;
    for(let x=-H;x<W+80;x+=80){c.beginPath();c.moveTo(x+off,0);c.lineTo(x+off+26,0);c.lineTo(x+off+26-H*.5,H);c.lineTo(x+off-H*.5,H);c.closePath();c.fill();}
    c.restore();return;
  }
  const sk=SKY.ally.map((v,i)=>mix(v,SKY.enemy[i],BE.tint));
  const g=c.createLinearGradient(0,0,0,hy);g.addColorStop(0,sk[0]);g.addColorStop(.5,sk[1]);g.addColorStop(.86,sk[2]);g.addColorStop(1,sk[3]);
  c.fillStyle=g;c.fillRect(0,0,W,hy+2);
  c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.5;c.drawImage(glowSpr(sk[3]),W*.62-W*.7,hy-W*.7,W*1.4,W*1.4);c.restore();
  c.save();c.globalAlpha=.22;c.fillStyle='#fff';
  for(let i=0;i<6;i++){const x=((i*263-(BE.cam.x+BE.bgScroll)*.05*z-BE.t*.012)%(W+500)+W+500)%(W+500)-250,y=hy*(.15+.1*(i%3));
    c.beginPath();c.ellipse(x,y,90+i*14,10+i%3*4,0,0,7);c.fill();}
  c.restore();
  hills(c,hy,H*.05,.06,mix(sk[1],'#000000',.35),1.7,14);
  const T=BE.terrain;
  if(T==='mount')hills(c,hy+4,H*.09,.14,mix(sk[1],'#0a0a0a',.55),4.1,8,1.3);
  else if(T==='forest'){hills(c,hy+4,H*.035,.14,'#16301a',2.3,8);
    const cx=(BE.cam.x+BE.bgScroll)*.22*z;c.fillStyle='#0f2413';
    for(let i=-2;i<W/26+3;i++){const x=i*26-(cx%26),r=14+((i+Math.floor(cx/26))*7%5)*3;c.beginPath();c.arc(x,hy+6-r*.4,r,0,7);c.fill();}}
  else if(T==='water')hills(c,hy+2,H*.015,.1,mix(sk[1],'#000',.5),6.2,12);
  else if(T==='ruin'){const cx=(BE.cam.x+BE.bgScroll)*.22*z,col=mix(sk[1],'#05060a',.62);
    for(let i=-2;i<W/38+3;i++){const n=i+Math.floor(cx/38),hh=H*.04+((n*37%11+11)%11)*H*.011,x=i*38-(cx%38);
      c.fillStyle=col;c.beginPath();c.moveTo(x,hy+6);c.lineTo(x,hy-hh);c.lineTo(x+9,hy-hh-7);c.lineTo(x+16,hy-hh+3);c.lineTo(x+28,hy-hh-3);c.lineTo(x+30,hy+6);c.closePath();c.fill();
      c.fillStyle='rgba(255,170,90,.55)';for(let k=0;k<3;k++)if((n*7+k*3)%5===0)c.fillRect(x+6+k*7,hy-hh*.6+k*5,2.5,2.5);}}
  else hills(c,hy+4,H*.03,.14,mix('#2d4a24',sk[1],.3),3.3,10);
  const gc=GRD[T]||GRD.plain;const gg=c.createLinearGradient(0,hy,0,H);gg.addColorStop(0,mix(gc[0],sk[3],.25));gg.addColorStop(1,gc[1]);
  c.fillStyle=gg;c.fillRect(0,hy,W,H-hy);
  c.save();c.strokeStyle=T==='water'?'rgba(200,230,255,.16)':'rgba(0,0,0,.18)';c.lineWidth=1;
  const camX=BE.cam.x+BE.bgScroll,sp=90;
  for(let k=Math.floor((camX-W/z*3)/sp);k<(camX+W/z*3)/sp;k++){
    const wx=k*sp,xb=W/2+(wx-camX)*z*2.4,xh=W/2+(wx-camX)*z*.35;
    if(xb<-W*2||xb>W*3)continue;c.beginPath();c.moveTo(xh,hy);c.lineTo(xb,H);c.stroke();}
  for(let i=1;i<8;i++){const y=hy+(H-hy)*Math.pow(i/8,1.8);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  if(T==='water'){c.globalCompositeOperation='lighter';c.fillStyle='rgba(220,240,255,.35)';
    for(let i=0;i<24;i++){const y=hy+(H-hy)*Math.pow((i*.37)%1,1.6),x=((i*151-camX*z*.8+BE.t*.02*(i%3+1))%(W+80)+W+80)%(W+80)-40;c.fillRect(x,y,14+(i%4)*6,1.5);}}
  c.restore();
  if(BE.dark>0){c.fillStyle=`rgba(12,0,24,${BE.dark*.65})`;c.fillRect(0,0,W,H);}
}
function drawParts(c,additive){
  for(const p of BE.parts){
    const k=p.age/p.life;
    if(additive){
      if(p.t==='spark'){c.strokeStyle=hexA(p.col,1-k);c.lineWidth=p.size;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.028,p.y-p.vy*.028);c.stroke();}
      else if(p.t==='glow'||p.t==='fire'){const s=p.size*(p.t==='fire'?1:1+k*.3);c.globalAlpha=Math.pow(1-k,p.t==='fire'?1.2:1.5)*(p.a||1);c.drawImage(glowSpr(p.col),p.x-s,p.y-s,s*2,s*2);c.globalAlpha=1;}
      else if(p.t==='ring'){c.strokeStyle=hexA(p.col,(1-k)*.9);c.lineWidth=p.w*(1-k)+1;c.beginPath();c.ellipse(p.x,p.y,p.size,p.size*(p.flat||1),0,0,7);c.stroke();}
      else if(p.t==='glint'){const s=p.size*Math.sin(Math.PI*k);c.save();c.translate(p.x,p.y);c.rotate(k*1.2);c.fillStyle='rgba(255,255,255,.95)';
        for(let j=0;j<2;j++){c.rotate(Math.PI/2);c.beginPath();c.moveTo(-s,0);c.lineTo(0,-s*.07);c.lineTo(s,0);c.lineTo(0,s*.07);c.closePath();c.fill();}
        c.drawImage(glowSpr(p.col),-s*.4,-s*.4,s*.8,s*.8);c.restore();}
    }else{
      if(p.t==='smoke'){c.globalAlpha=(1-k)*(p.a||.5);const s=p.size*1.5;c.drawImage(smokeSpr(p.c),p.x-s,p.y-s,s*2,s*2);c.globalAlpha=1;}
      else if(p.t==='debris'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=1-k*k*k;c.fillStyle='#2A2A33';c.fillRect(-p.size,-p.size*.6,p.size*2,p.size*1.2);
        c.fillStyle='#FF9A3C';c.fillRect(-p.size*.4,-p.size*.3,p.size*.5,p.size*.4);c.restore();}
      else if(p.t==='dark'){c.globalAlpha=(1-k)*.85;const s=p.size*(1+k)*1.5;c.drawImage(smokeSpr('34,6,56'),p.x-s,p.y-s,s*2,s*2);c.globalAlpha=1;}
    }
  }
}
function drawBeams(c){
  for(const b of BE.beams){
    if(b.follow){const p=chestOf(b.follow);b.x2=p.x;b.y2=p.y;}
    const dx=b.x2-b.x1,dy=b.y2-b.y1,L=Math.hypot(dx,dy)*b.grow;if(L<1)continue;
    c.save();c.translate(b.x1,b.y1);c.rotate(Math.atan2(dy,dx));c.globalCompositeOperation='lighter';
    const f=1+Math.sin(BE.t*.09+b.w)*.1;
    for(const [m,a,white] of [[2.6,.18],[1.5,.42],[.85,.9],[.38,1,1]]){
      const lw=b.w*m*f;c.fillStyle=white?`rgba(255,255,255,${b.alpha})`:hexA(b.col,a*b.alpha);
      c.beginPath();c.moveTo(0,-lw/2);c.lineTo(L,-lw/2);c.arc(L,0,lw/2,-Math.PI/2,Math.PI/2);c.lineTo(0,lw/2);c.arc(0,0,lw/2,Math.PI/2,Math.PI*1.5);c.fill();}
    c.globalAlpha=b.alpha;c.drawImage(glowSpr(b.col),L-b.w*3,-b.w*3,b.w*6,b.w*6);c.drawImage(glowSpr(b.col),-b.w*2.5,-b.w*2.5,b.w*5,b.w*5);
    c.restore();
  }
}
function drawArcs(c){
  c.save();c.globalCompositeOperation='lighter';
  for(const a of BE.arcs){
    const k=a.age/a.dur,prog=Math.min(1,k/.3),al=k<.3?1:1-(k-.3)/.7,N=26,aE=a.a0+(a.a1-a.a0)*prog;
    for(const [wm,col,alp] of [[1,a.col,.75],[.45,'#ffffff',1]]){
      c.fillStyle=hexA(col==='#ffffff'?'#ffffff':col,alp*al);c.beginPath();
      for(let i=0;i<=N;i++){const th=a.a0+(aE-a.a0)*i/N,u=i/N,w=a.w*wm*Math.pow(u,1.1)*(1-Math.pow(u,10)*.5);c.lineTo(a.cx+Math.cos(th)*a.r,a.cy+Math.sin(th)*a.r);}
      for(let i=N;i>=0;i--){const th=a.a0+(aE-a.a0)*i/N,u=i/N,w=a.w*wm*Math.pow(u,1.1)*(1-Math.pow(u,10)*.5);c.lineTo(a.cx+Math.cos(th)*(a.r-w),a.cy+Math.sin(th)*(a.r-w));}
      c.closePath();c.fill();}
  }
  c.restore();
}
function drawProjs(c){
  for(const q of BE.projs){
    if(q.t==='bullet'){const sp=Math.hypot(q.vx,q.vy),ux=q.vx/sp,uy=q.vy/sp;c.save();c.globalCompositeOperation='lighter';
      const g=c.createLinearGradient(q.x,q.y,q.x-ux*46,q.y-uy*46);g.addColorStop(0,'#fff');g.addColorStop(.3,q.col);g.addColorStop(1,hexA(q.col,0));
      c.strokeStyle=g;c.lineWidth=3;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x-ux*46,q.y-uy*46);c.stroke();c.drawImage(glowSpr(q.col),q.x-8,q.y-8,16,16);c.restore();}
    else if(q.t==='missile'){c.save();c.translate(q.x,q.y);c.rotate(Math.atan2(q.vy,q.vx));
      c.fillStyle='#E6EAF0';c.fillRect(-9,-2.6,15,5.2);c.fillStyle='#D23A33';c.beginPath();c.moveTo(6,-2.6);c.lineTo(11,0);c.lineTo(6,2.6);c.fill();
      c.fillStyle='#5A606C';c.fillRect(-10,-4,4,8);c.globalCompositeOperation='lighter';c.drawImage(glowSpr('#FFB050'),-24,-8,16,16);c.restore();}
    else if(q.t==='shell'){c.fillStyle='#3A3530';c.beginPath();c.arc(q.x,q.y,6,0,7);c.fill();c.save();c.globalCompositeOperation='lighter';c.drawImage(glowSpr('#FF8A3C'),q.x-12,q.y-12,24,24);c.restore();}
  }
}
function drawActors(c){
  for(const a of BE.actors){if(!a.vis)continue;

const AUDIO={ctx:null,master:null,music:null,musicTimer:null,beat:0,noise:null};
function audioInit(){
 try{
  if(!AUDIO.ctx){
   const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
   AUDIO.ctx=new AC();AUDIO.master=AUDIO.ctx.createGain();AUDIO.master.gain.value=.18;AUDIO.master.connect(AUDIO.ctx.destination);
   const b=AUDIO.ctx.createBuffer(1,AUDIO.ctx.sampleRate,AUDIO.ctx.sampleRate),d=b.getChannelData(0);
   for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AUDIO.noise=b;
  }
  if(AUDIO.ctx.state==='suspended')AUDIO.ctx.resume().catch(()=>{});
  audioMusic();
 }catch(e){/* Unsupported / blocked Web Audio never blocks gameplay. */}
}
function tone(freq,dur=.1,type='sine',gain=.2,end=0,delay=0){

 const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(freq,t);if(end)o.frequency.exponentialRampToValueAtTime(Math.max(10,end),t+dur);

 o.connect(g);g.connect(AUDIO.master);o.start(t);o.stop(t+dur+.03);

 const n=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter(),t=ac.currentTime;
 n.buffer=AUDIO.noise;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);

function audioFx(name){

  case 'click':tone(740,.045,'sine',.15,1080);break;
  case 'launch':tone(110,.55,'sawtooth',.11,440);hiss(.4,.18,1200);break;
  case 'rifle':tone(1700,.21,'sawtooth',.18,150);hiss(.13,.12,3800);break;
  case 'charge':tone(140,.75,'sine',.28,1100);tone(280,.75,'triangle',.12,2200);break;
  case 'slash':hiss(.25,.5,6500);tone(960,.17,'sawtooth',.1,120);break;
  case 'impact':hiss(.3,.65,1500);tone(110,.28,'sine',.6,30);break;
  case 'rocket':hiss(.45,.55,2400);tone(65,.35,'sawtooth',.24,24);break;
  case 'lock':tone(1480,.075,'sine',.18);tone(1960,.075,'sine',.13,0,.1);break;

/* ================= 战斗编排 ================= */
function mkActor(u){
  const K=KINDS[u.kind];
  const a={id:u.id,kind:u.kind,x:0,y:0,oy:96-K.feet,face:1,s:1,pose:{...POSE.hover,can:14,pod:0},flash:0,thrust:.3,trail:false,ghosts:[],gt:0,
    blade:0,bladeLen:K.bladeLen,aura:0,pts:{},rec:true,vis:true,prop:u.prop,bob:0,hover:true,glowK:1};
  BE.actors.push(a);return a;
}
function stageSetup(A,D,dir){
  A.face=dir;D.face=-dir;A.x=0;A.y=0;D.x=dir*BE.gap;D.y=0;
  for(const a of [A,D]){a.pose={...POSE.hover,can:14,pod:0};a.trail=false;a.ghosts=[];a.thrust=.3;a.blade=0;a.funnelOut=0;a.aura=0;a.flash=0;a.vis=true;a.glowK=1;a.capeWind=0;a.bladeLen=KINDS[a.kind].bladeLen;}
  BE.drones=[];BE.reticles=[];BE.follow=null;BE.cam.x=dir*40;BE.cam.y=-6;BE.cam.z=BE.z0;BE.speedL=0;BE.radial=0;BE.dark=0;BE.cutBg=0;BE.letter=0;
}
function cutTo(x,y,z){BE.follow=null;BE.cam.x=x;BE.cam.y=y;BE.cam.z=z;}
function slowmo(f,ms){BE.slow=f;clearTimeout(BE.slowT);BE.slowT=setTimeout(()=>{BE.slow=1;},ms);}
async function cockpit(pid,exp,side,ms,tag){BE.cock={pid,exp,side,t0:BE.t,dur:ms,tag};await wait(ms+160);}
function killMoment(s){if(s.killed&&!s.slowed){s.slowed=true;slowmo(.28,520);BE.punch=Math.max(BE.punch,.12);}}
async function entry(A,dir){
  A.x=BE.cam.x-dir*(BE.W/2/BE.cam.z+160);Object.assign(A.pose,POSE.dash);A.trail=true;A.thrust=1.2;BE.speedL=.8;BE.speedDir=dir;
  poseTo(A,'brake',400,'outCubic');
  await tween(A,{x:0},400,'outCubic');
  A.trail=false;BE.speedL=0;tween(A,{thrust:.3},300);poseTo(A,'hover',300);
  await wait(120);
}
function land(s,D){
  if(s.landed)return;s.landed=true;
  showNum(D,{v:s.dmg,crit:s.crit,def:s.defending});
  setB(s.def.side==='ally'?'L':'R',s.after,s.def.maxHp,false);
  if(s.crit){BE.invert=Math.max(BE.invert,70);BE.shake=Math.max(BE.shake,14);}
}
async function dodge(D,dir){
  D.trail=true;D.thrust=1.3;poseTo(D,'dodge',140);(async()=>{await wait(200);showNum(D,{miss:true});})();
  if(!BE.follow)tween(BE.cam,{x:D.x+dir*40},320,'outCubic');
  await tween(D,{x:D.x+dir*90,y:D.y-70},230,'outCubic');
  await wait(260);D.trail=false;D.thrust=.3;poseTo(D,'hover',320);tween(D,{y:D.y+50},420,'inOutSine');
}
function hurt(D,s,dir,kb=30){
  poseTo(D,s.defending?'guard':'hurt',70,'outCubic');
  tween(D,{x:D.x+dir*kb*(s.defending?.4:1)},220,'outCubic');
}
function recover(D){poseTo(D,'hover',420,'inOutSine');}
async function exitBack(A,dir){
  A.trail=true;poseTo(A,'dodge',200);await tween(A,{x:A.x-dir*150,y:-40},300,'outCubic');
  A.trail=false;poseTo(A,'hover',340);tween(A,{y:0},400,'inOutSine');
}
async function cutIn(A,s,line){
  const dir=A.face;
  tween(BE,{letter:1},260);
  showLine(s.att.pid,line,s.att.side,'shout');
  await cockpit(s.att.pid,'shout',s.att.side,950,'必杀');
  BE.cutBg=1;BE.radial=1;BE.side=s.att.side;
  poseTo(A,'cut',260);
  BE.follow={a:A,pt:'eye',ox:-dir*6,oy:4,k:1};BE.cam.z=BE.z0*3.1;
  tween(BE.cam,{z:BE.z0*3.6},1200,'linear');
  await wait(480);
  const e=ptOf(A,'eye');part({t:'glint',x:e.x,y:e.y,vx:0,vy:0,life:520,size:46,col:KINDS[A.kind].col.g});
  A.glowK=2.4;BE.flash=.3;BE.flashCol='#ffffff';
  await wait(720);
  BE.follow=null;BE.cutBg=0;BE.radial=0;A.glowK=1.4;
  BE.cam.x=A.x+dir*40;BE.cam.y=-6;BE.cam.z=BE.z0;
}

async function aGun(s,A,D,dir,vulcan){
  poseTo(A,vulcan?'hover':'aim',220,'outCubic',vulcan?{head:-14}:null);
  await wait(260);
  const n=vulcan?12:16,tgt=chestOf(D),col=vulcan?'#FFF0A0':'#FFD27A';let first=true;
  const m0=ptOf(A,vulcan?'headGun':'muzzle');cutTo(m0.x-dir*(vulcan?30:16),m0.y+(vulcan?8:0),BE.z0*(vulcan?2.6:2.3));
  if(!s.hit)(async()=>{await wait(170);dodge(D,dir);})();
  for(let i=0;i<n;i++){
    const m=ptOf(A,vulcan?'headGun':'muzzle'),tx=tgt.x-dir*rnd(0,16),ty=tgt.y+rnd(-26,26);
    muzzleFlash(m.x,m.y,dir,vulcan?.6:1);
    if(!vulcan){A.pose.sF=-90+rnd(-4,4);A.x-=dir*1.2;}
    bullet(m.x,m.y,s.hit?tx:tx+dir*420,s.hit?ty:ty+rnd(-40,40),2700,s.hit?()=>{
      const c=chestOf(D);hitFx(D,{x:c.x-dir*14+rnd(-6,6),y:c.y+(ty-tgt.y)},dir,.42,col);D.x+=dir*2.4;
      if(first){first=false;hurt(D,s,dir,6);}
      if(s.killed)killMoment(s);
    }:null,col);
    if(i===4){cutTo(A.x+dir*110,-6,BE.z0);tween(BE.cam,{x:D.x+dir*10},300,'inOutCubic');}
    await wait(vulcan?58:52);
  }
  await wait(320);
  if(s.hit){land(s,D);recover(D);}
  poseTo(A,'hover',300);
}
async function aBeam(s,A,D,dir,src,pose,col,w){
  poseTo(A,pose,260);
  await wait(280);
  {const m=ptOf(A,src);cutTo(m.x-dir*26,m.y+6,BE.z0*2.5);tween(BE.cam,{z:BE.z0*2.8},560,'linear');}
  for(let i=0;i<15;i++){const m=ptOf(A,src);chargeFx(m.x,m.y,col,i/15);if(i%5===4)BE.shake=Math.max(BE.shake,2);await wait(36);}
  cutTo(A.x+dir*60,-8,BE.z0*1.08);
  const m=ptOf(A,src),c=chestOf(D),dx=c.x-m.x,dy=c.y-m.y,L=Math.hypot(dx,dy);
  const end=s.hit?c:{x:m.x+dx/L*1900,y:m.y+dy/L*1900-120};
  const b=beam(m.x,m.y,end.x,end.y,w,col);tween(b,{grow:1},200,'outQuad');
  BE.flash=.45;BE.flashCol=col;BE.shake=12;poseTo(A,'recoil',120);tween(A,{x:A.x-dir*18},220,'outCubic');
  flashAt(m.x,m.y,90,col,300);
  await wait(200);
  tween(BE.cam,{x:D.x+dir*10,z:BE.z0},260,'inOutCubic');
  if(!s.hit)dodge(D,dir);
  await wait(170);
  if(s.hit){
    b.follow=D;hitStop(60);killMoment(s);const p=chestOf(D);boom(p.x-dir*10,p.y,.9);hurt(D,s,dir,44);land(s,D);
    for(let k=0;k<8;k++){const q=chestOf(D);sparks(q.x-dir*12,q.y,6,dir,col);D.flash=.8;await wait(55);}
    recover(D);
  }else await wait(420);
  fadeBeam(b,260);poseTo(A,'hover',300);
  await wait(280);
}
async function aMissile(s,A,D,dir,grenade){
  poseTo(A,'launch',240,'outCubic');
  await wait(240);
  {const p=ptOf(A,'pods');cutTo(p.x-dir*10,p.y+10,BE.z0*2.4);}
  tween(A.pose,{pod:1},260,'outBack');BE.shake=3;await wait(320);
  const n=grenade?3:8,base=chestOf(D);let arrived=0,first=true;
  if(!s.hit)(async()=>{await wait(grenade?640:560);dodge(D,dir);})();
  const onArrive=(tx,ty)=>()=>{
    arrived++;
    if(s.hit){const c=chestOf(D);boom(c.x+rnd(-26,26)-dir*10,c.y+rnd(-34,34),grenade?1.1:.62);D.flash=.6;D.x+=dir*(grenade?10:5);
      if(first){first=false;hurt(D,s,dir,10);}
      if(arrived===n){killMoment(s);land(s,D);recover(D);}}
    else boom(tx+dir*rnd(20,80),ty+rnd(-20,30),grenade?.9:.5);
  };
  for(let i=0;i<n;i++){
    const p=ptOf(A,'pods'),tx=base.x+rnd(-24,24),ty=base.y+rnd(-40,40);
    if(grenade){shell(p.x,p.y,tx,ty,820,onArrive(tx,ty));flashAt(p.x,p.y,40,'#FFB050',120);BE.shake=5;}
    else missile(p.x,p.y,dir,tx,ty,onArrive(tx,ty));
    part({t:'smoke',x:p.x,y:p.y,vx:-dir*60,vy:-40,life:700,size:10,grow:30,c:'210,210,220',a:.5});
    await wait(grenade?170:62);
    if(i===(grenade?0:2))cutTo(A.x+dir*90,-30,BE.z0*.95);
  }
  tween(BE.cam,{x:A.x+dir*230},340,'inOutSine');await wait(340);
  tween(BE.cam,{x:D.x+dir*6},320,'inOutCubic');
  await waitUntil(()=>arrived>=n,2600);
  await wait(380);tween(A.pose,{pod:0},300);poseTo(A,'hover',300);
}
async function aSlash(s,A,D,dir,claw){
  const K=KINDS[A.kind],col=K.blade;
  {const h=ptOf(A,'hand');cutTo(h.x+dir*18,h.y+4,BE.z0*2.7);tween(BE.cam,{z:BE.z0*3},420,'linear');}
  await wait(120);
  tween(A,{blade:1},200,'outBack');{const h=ptOf(A,'hand');flashAt(h.x,h.y,60,col,300);part({t:'glint',x:h.x+dir*10,y:h.y,vx:0,vy:0,life:420,size:30,col});}
  await wait(320);
  cutTo(A.x+dir*70,-6,BE.z0);
  poseTo(A,'dash',180);A.trail=true;A.thrust=1.3;BE.speedL=1;BE.speedDir=dir;
  BE.follow={a:A,ox:dir*70,k:.22};
  tween(A,{x:D.x-dir*(claw?100:112),y:-8},440,'inOutCubic');
  await wait(290);poseTo(A,'wind',150,'outCubic');await wait(150);
  BE.follow=null;BE.speedL=0;tween(BE.cam,{x:(A.x+D.x)/2},160,'outCubic');
  if(!s.hit)dodge(D,dir);
  poseTo(A,'slash',95,'inCubic');await wait(60);
  if(claw)for(let i=0;i<3;i++){const c=chestOf(D);slashArc(c.x-dir*40,c.y-8+i*14-14,70-i*6,(dir>0?-110:-70)*R,(dir>0?45:225)*R,12,col);}
  else arcFor(A,D,dir,1,col);
  if(s.hit){hitStop(85);hitFx(D,chestOf(D),dir,1.2,col);hurt(D,s,dir,34);if(s.killed&&!(claw||s.w.power>=2400))killMoment(s);}
  await wait(230);
  if(s.hit&&(claw||s.w.power>=2400)){
    poseTo(A,'wind',120,'inCubic');await wait(70);arcFor(A,D,dir,.9,col,true);
    hitStop(60);killMoment(s);hitFx(D,chestOf(D),dir,.9,col);tween(D,{x:D.x+dir*26},180,'outCubic');await wait(200);
  }
  if(s.hit)land(s,D);
  A.trail=false;await exitBack(A,dir);tween(A,{blade:0},200);
  if(s.hit)recover(D);
  await wait(150);
}
async function aPunch(s,A,D,dir){
  poseTo(A,'punchWind',220);await wait(160);
  {const h=ptOf(A,'hand');cutTo(h.x+dir*6,h.y,BE.z0*2.6);}

let G=null;
const S={mode:'idle',u:null,origin:null,reach:null,prev:null,w:null,targets:null,t:null,inter:'mingsun'};
const lvB=u=>(u.lv-1)*1.5;
function mk(tk,side,x,y,o={}){
  const t=TPL[tk],P=PILOTS[t.pid];
  let up={hp:0,en:0,arm:0,mob:0,wpn:0},pl={lv:o.lv||(G&&G.stage?G.stage.elv:1),exp:0};
  if(side==='ally'&&SAVE){up=SAVE.up[tk]||up;pl=SAVE.pilots[tk]||pl;}
  const maxHp=(o.hp||t.hp)+up.hp*UP.hp.per,maxEn=t.en+up.en*UP.en.per,maxSp=t.sp?t.sp+(pl.lv-1)*3:0;
  const u={...t,id:G.nextId++,tk,side,x,y,pilot:P.name,maxHp,hp:maxHp,maxEn,en:maxEn,maxSp,sp:maxSp,
    armor:(o.armor||t.armor)+up.arm*UP.arm.per,eva:t.eva+up.mob*UP.mob.per,wmul:1+up.wpn*UP.wpn.per/100,
    lv:pl.lv,exp:pl.exp||0,will:o.will||100,hold:o.hold||0,fx:{},acted:false,alive:true,kills:0,wake:side==='ally'||!!o.wake,
    spirits:(P.spirits||[]).filter(([n,l])=>l<=pl.lv).map(([n])=>n)};
  G.units.push(u);return u;
}
function unitAt(x,y){return G.units.find(u=>u.alive&&u.x===x&&u.y===y);}
function canUse(u,w){return u.en>=w.en&&u.will>=w.will;}
function inR(w,r){return r>=w.min&&r<=w.max;}
function targetsFrom(u,w,x,y){return G.units.filter(o=>o.alive&&o.side!==u.side&&inR(w,dist(x,y,o.x,o.y)));}
function hpCol(r){return r>.5?'var(--hp)':r>.25?'var(--gold)':'var(--enemy)';}
function enemiesAlive(){return G.units.filter(u=>u.alive&&u.side==='enemy').length;}
function findU(tk){return G.units.find(u=>u.tk===tk&&u.alive);}
function hpBelow(tk,r){const b=findU(tk);return !!b&&b.hp<=b.maxHp*r;}
function reachMap(u,from){
  const sx=from?from.x:u.x,sy=from?from.y:u.y,mv=u.move+(u.fx['加速']?3:0);
  if(u.hold&&G.turn<u.hold)return {set:new Set([key(sx,sy)]),prev:new Map()};
  const best=new Map([[key(sx,sy),0]]),prev=new Map(),q=[[sx,sy,0]];
  while(q.length){
    q.sort((a,b)=>a[2]-b[2]);const [x,y,c]=q.shift();
    if(c>best.get(key(x,y)))continue;
    for(const [dx,dy] of DIRS){
      const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      const o=unitAt(nx,ny);if(o&&o.side!==u.side)continue;
      const nc=c+ter(nx,ny).cost;if(nc>mv)continue;
      const k=key(nx,ny);if(best.has(k)&&best.get(k)<=nc)continue;
      best.set(k,nc);prev.set(k,key(x,y));q.push([nx,ny,nc]);
    }
  }
  const set=new Set();
  for(const k of best.keys()){const [x,y]=k.split(',').map(Number);const o=unitAt(x,y);if((!o||o===u)&&ter(x,y).cost<99)set.add(k);}
  return {set,prev};
}
function reachable(u){return reachMap(u).set;}
function pathTo(prev,from,to){const p=[];let k=to;while(k&&k!==from){p.push(k);k=prev.get(k);}return p.reverse().map(k=>k.split(',').map(Number));}
async function walk(u,path){for(const [x,y] of path){u.x=x;u.y=y;renderUnits();await sleep(85);}}
function hitRate(a,w,d,evade){
  if(d.fx['必闪'])return 0;
  if(a.fx['必中'])return 100;
  let h=70+a.hit+lvB(a)+w.hit-d.eva-lvB(d)-ter(d.x,d.y).eva;
  if(a.fx['集中'])h+=30;if(d.fx['集中'])h-=30;
  if(SET.diff==='easy')h+=a.side==='ally'?8:-8;
  h=clamp(Math.round(h),0,100);return evade?Math.round(h/2):h;
}
function baseDmg(a,w,d,defending){
  let v=w.power*(a.wmul||1)*(1+(a.lv-1)*.015)*a.will/100-d.armor*d.will/100*.5;
  v*=ter(d.x,d.y).def;
  if(a.fx['魂'])v*=2.5;else if(a.fx['热血'])v*=2;
  if(d.fx['铁壁'])v*=.25;if(defending)v*=.5;
  if(SET.diff==='easy')v*=a.side==='ally'?1.1:.8;
  return Math.max(10,Math.round(v/10)*10);
}
function critRate(a,w){return clamp(w.crit+Math.floor((a.hit+lvB(a))/5),0,50);}
function bestCounter(d,a){
  const r=dist(d.x,d.y,a.x,a.y);let best=null,bs=-1;
  for(const w of d.weapons){if(w.map||!canUse(d,w)||!inR(w,r))continue;const s=hitRate(d,w,a)*baseDmg(d,w,a,false);if(s>bs){bs=s;best=w;}}
  return best;
}
function strike(a,w,d,defending,evading){
  const fx=Object.keys(a.fx).filter(k=>['热血','魂','必中','集中'].includes(k));
  a.en-=w.en;
  const hr=hitRate(a,w,d,evading),hit=Math.random()*100<hr,before=d.hp;
  delete d.fx['必闪'];
  let dmg=0,crit=false;
  if(hit){
    dmg=baseDmg(a,w,d,defending);crit=Math.random()*100<critRate(a,w);if(crit)dmg*=1.5;
    dmg=Math.max(10,Math.round(dmg*(.92+Math.random()*.16)/10)*10);
    d.hp=Math.max(0,d.hp-dmg);a.will=Math.min(150,a.will+3);d.will=Math.min(150,d.will+2);
  }else{a.will=Math.min(150,a.will+1);d.will=Math.min(150,d.will+3);}
  delete a.fx['热血'];delete a.fx['魂'];
  if(d.side==='enemy')alertAround(d);
  const killed=d.hp<=0;
  if(killed){d.alive=false;a.will=Math.min(150,a.will+8);a.kills++;
    if(a.side==='ally'){G.funds+=d.funds||0;G.stats.kills++;}else G.stats.lost++;}
  return {att:a,def:d,w,hit,dmg,crit,killed,defending,before,after:d.hp,fx};
}
function alertAround(d){
  d.wake=true;for(const o of G.units)if(o.alive&&o.side==='enemy'&&!o.wake&&dist(o.x,o.y,d.x,d.y)<=3){o.wake=true;o.justWoke=true;}
}
function movedNow(u){return S.u===u&&S.origin&&(u.x!==S.origin.x||u.y!==S.origin.y);}
function usableNow(u,w){return canUse(u,w)&&!(w.np&&movedNow(u));}
function mapTargets(u,w){return G.units.filter(o=>o.alive&&o.side!==u.side&&dist(u.x,u.y,o.x,o.y)<=w.map);}
function findSupport(a,t){
  let best=null,bs=0;
  for(const s of G.units){
    if(!s.alive||s===a||s.side!==a.side||s.supUsed||dist(s.x,s.y,a.x,a.y)!==1)continue;
    const r=dist(s.x,s.y,t.x,t.y);
    for(const w of s.weapons){if(w.map||!canUse(s,w)||!inR(w,r))continue;const v=hitRate(s,w,t)*baseDmg(s,w,t,false);if(v>bs){bs=v;best={u:s,w};}}
  }
  return best;
}
function findGuard(t){
  return G.units.find(g=>g.alive&&g!==t&&g.side===t.side&&g.guard&&!g.guardUsed&&dist(g.x,g.y,t.x,t.y)===1&&g.hp>g.maxHp*.3)||null;
}
function gainExp(u,t,kill){
  const m=clamp(1+(t.lv-u.lv)*.15,.4,2.5)*(t.boss||t.cmd?2:1),msgs=[];
  u.exp+=Math.round((kill?42:12)*m);
  while(u.exp>=100){u.exp-=100;u.lv++;if(u.maxSp){u.maxSp+=3;u.sp=Math.min(u.maxSp,u.sp+3);}
    msgs.push(`${u.pilot} 升到 Lv ${u.lv}`);
    for(const [n,l] of PILOTS[u.pid].spirits||[])if(l===u.lv&&!u.spirits.includes(n)){u.spirits.push(n);msgs.push(`${u.pilot} 学会精神「${n}」`);}}
  return msgs;
}
function threat(u){
  const reach=[...reachable(u)].map(k=>k.split(',').map(Number));
  const mr=Math.max(...u.weapons.filter(w=>u.will>=w.will).map(w=>w.max));const s=new Set();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(ter(x,y).cost<99&&reach.some(([rx,ry])=>dist(x,y,rx,ry)<=mr))s.add(key(x,y));
  return s;
}

function talk(lines){
  return new Promise(res=>{
    if(!lines||!lines.length)return res();
    const T=$('#talk'),txt=$('#tkText');let i=0,timer=null,full='';
    const show=()=>{
      if(i>=lines.length){end();return;}
      const [who,text,exp]=lines[i],P=PILOTS[who];
      T.className='talk '+(who==='sys'?'sys':P.side);
      $('#tkName').textContent=P.name||'';
      if(who==='sys')$('#tkPor').style.display='none';else{$('#tkPor').style.display='';$('#tkImg').src=portraitURL(who,exp||'normal');}
      $('#tkPor').classList.remove('shake');void $('#tkPor').offsetWidth;if(exp==='shout'||exp==='hurt')$('#tkPor').classList.add('shake');
      full=text;let n=0;txt.textContent='';clearInterval(timer);
      timer=setInterval(()=>{n++;txt.textContent=full.slice(0,n);if(n>=full.length){clearInterval(timer);timer=null;}},26);
    };
    const next=e=>{if(e&&e.target&&e.target.closest('#tkSkip'))return;
      if(timer){clearInterval(timer);timer=null;txt.textContent=full;return;}i++;show();};
    const key=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}};
    const skip=e=>{e.stopPropagation();end();};
    const end=()=>{clearInterval(timer);T.classList.add('hidden');T.removeEventListener('click',next);$('#tkSkip').removeEventListener('click',skip);removeEventListener('keydown',key);res();};
    T.addEventListener('click',next);$('#tkSkip').addEventListener('click',skip);addEventListener('keydown',key);
    T.classList.remove('hidden');show();
  });
}

}

function idleHL(extra){setHL(Object.assign({danger:G&&G.danger&&G.phase==='player'?dangerSet():null},extra||{}));}
function clearSel(){Object.assign(S,{mode:'idle',u:null,origin:null,reach:null,prev:null,w:null,targets:null,t:null,look:null});idleHL();renderPanel();}
function selectAlly(u){
  const rm=reachMap(u);Object.assign(S,{mode:'move',u,origin:{x:u.x,y:u.y},reach:rm.set,prev:rm.prev,w:null,targets:null});
  setHL({mv:S.reach,sel:key(u.x,u.y)});renderPanel();
}
function toAction(){
  const u=S.u;S.mode='action';S.w=null;const s=new Set();
  for(const w of u.weapons){if(!usableNow(u,w))continue;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(inR(w,dist(u.x,u.y,x,y)))s.add(key(x,y));}
  setHL({atk:s,sel:key(u.x,u.y)});renderPanel();
}
async function onTile(x,y){
  if(!G||G.phase!=='player'||G.busy)return;
  const k=key(x,y),o=unitAt(x,y);
  if(S.mode==='target'){const t=S.targets.find(t=>t.x===x&&t.y===y);if(t)openForecast(t);else toAction();return;}
  if(S.mode==='action')return;
  if(S.mode==='move'&&S.reach.has(k)&&(!o||o===S.u)){
    const u=S.u;G.busy=true;setHL({sel:k});await walk(u,pathTo(S.prev,key(S.origin.x,S.origin.y),k));G.busy=false;toAction();return;}
  if(o){
    if(o.side==='ally'&&!o.acted)selectAlly(o);
    else if(o.side==='ally'){Object.assign(S,{mode:'view',u:o});setHL({sel:k});renderPanel();}
    else{Object.assign(S,{mode:'enemy',u:o});setHL({threat:threat(o),sel:k});renderPanel();}
    return;
  }
  if(S.mode==='idle'&&S.look&&S.look.x===x&&S.look.y===y){clearSel();return;}
  clearSel();S.look={x,y};idleHL({look:k});renderPanel();
}
function openWeapons(u){
  let h=`<h3>选择武器</h3>`;
  u.weapons.forEach((w,i)=>{
    let why='';
    if(u.will<w.will)why=`气力需 ${w.will}`;else if(u.en<w.en)why='EN 不足';else if(w.np&&movedNow(u))why='移动后不可用';
    else if(w.map?!mapTargets(u,w).length:!targetsFrom(u,w,u.x,u.y).length)why=w.map?'范围内无敌机':'射程内无目标';
    const rng=w.map?`以自身为中心 ${w.map} 格`:w.min===w.max?`射程 ${w.min}`:`射程 ${w.min}–${w.max}`;
    const tags=(w.map?'<span class="wtag map">MAP</span>':'')+(w.np?'<span class="wtag">移动后不可用</span>':'');
    h+=`<button class="wrow" data-act="weapon" data-i="${i}"${why?' disabled':''}><span class="wn">${w.name}${tags}</span><span class="wp">${Math.round(w.power*(u.wmul||1))}</span><span class="wm">${rng}　EN ${w.en||'—'}　命中 ${w.hit>=0?'+':''}${w.hit}${w.will?'　气力 '+w.will:''}${why?`　<span class="why">${why}</span>`:''}</span></button>`;
  });
  openSheet(h+`<p class="sub">标着「移动后不可用」的武器威力大，但这回合移动过就不能用。先站好位置再开火。</p><div class="cmds">${btn('close','返回','alt')}</div>`);
}
function chooseWeapon(i){
  const u=S.u,w=u.weapons[i];S.w=w;
  const rng=new Set(),labels=new Map();
  if(w.map){
    S.mode='mapw';S.targets=mapTargets(u,w);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(dist(u.x,u.y,x,y)<=w.map)rng.add(key(x,y));
  }else{
    S.targets=targetsFrom(u,w,u.x,u.y);S.mode='target';
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(inR(w,dist(u.x,u.y,x,y)))rng.add(key(x,y));
  }
  for(const t of S.targets)labels.set(key(t.x,t.y),hitRate(u,w,t)+'%');
  setHL({atk:rng,tgt:new Set(S.targets.map(t=>key(t.x,t.y))),sel:key(u.x,u.y),labels});closeSheet();renderPanel();
}
function fcCol(u,side,rows,big){return `<div class="fcol ${side}"><div class="n">${u.name} <small>Lv${u.lv}</small></div><div class="r"><span>HP</span><b>${u.hp}/${u.maxHp}</b></div>${rows}${big}</div>`;}
function openForecast(t){
  const u=S.u,w=S.w;S.t=t;
  const cw=bestCounter(t,u),hr=hitRate(u,w,t),dm=baseDmg(u,w,t,!cw),cr=critRate(u,w);
  const left=fcCol(u,'ally',`<div class="r"><span>武器</span><b>${w.name}</b></div>`,`<div class="big">${hr}<small>% 命中</small></div><div class="r"><span>预计伤害</span><b class="${dm>=t.hp?'kill':''}">${dm}${dm>=t.hp?' 可击破':''}</b></div><div class="r"><span>暴击</span><b>${cr}%</b></div>`);
  const right=cw?fcCol(t,'enemy',`<div class="r"><span>反击</span><b>${cw.name}</b></div>`,`<div class="big">${hitRate(t,cw,u)}<small>% 命中</small></div><div class="r"><span>预计伤害</span><b class="${baseDmg(t,cw,u,false)>=u.hp?'kill':''}">${baseDmg(t,cw,u,false)}</b></div><div class="r"><span>暴击</span><b>${critRate(t,cw)}%</b></div>`)
    :fcCol(t,'enemy',`<div class="r"><span>应对</span><b>防御</b></div>`,`<div class="big">—</div><div class="r"><span>无法反击</span><b>伤害减半</b></div>`);
  S.sup=findSupport(u,t);
  const sup=S.sup?`<div class="supbox"><b>援护攻击</b>　${S.sup.u.name}「${S.sup.w.name}」　命中 ${hitRate(S.sup.u,S.sup.w,t)}%　预计 ${baseDmg(S.sup.u,S.sup.w,t,false)}</div>`
    :`<div class="supbox off">让队友站在攻击者旁边 1 格，就能发动援护攻击</div>`;
  openSheet(`<h3>战斗预测</h3><div class="fc">${left}<div class="vs">VS</div>${right}</div>${sup}<div class="cmds">${btn('go','出击','red')}${btn('close','返回','alt')}</div>`);
}
async function confirmAttack(){
  const u=S.u,w=S.w,t=S.t,sup=S.sup;closeSheet();G.busy=true;updateTop();setHL({});
  const killed=await runBattle(u,w,t,null,{sup});
  await finishAction(u,killed);
}
async function finishAction(u,killed){
  if(u.alive)u.acted=true;
  clearSel();renderUnits();
  const ended=await afterBattle();G.busy=false;updateTop();
  if(ended)return;
  if(u.alive&&u.react&&killed&&!u.reacted){u.reacted=true;u.acted=false;renderUnits();popAt(u,'再动！','crit');toast(`${u.name} 击破敌机，再次行动！`);selectAlly(u);return;}
  renderPanel();checkAutoEnd();
}
async function mapAttack(){
  const u=S.u,w=S.w,targets=S.targets.slice();
  G.busy=true;updateTop();setHL({});u.en-=w.en;
  await banner(w.name,`${u.pilot}：「${PILOTS[u.pid].ult||'消失吧！'}」`,u.side);
  const board=$('#board'),ring=document.createElement('div');
  ring.className='mapring';ring.style.setProperty('--x',u.x);ring.style.setProperty('--y',u.y);ring.style.setProperty('--r',w.map);
  board.appendChild(ring);board.classList.add('shake');await sleep(650);
  const w0={...w,en:0},msgs=[];let kills=0;
  for(const t of targets){
    const s=strike(u,w0,t,false,false);
    popAt(t,s.hit?(s.crit?'暴击 ':'')+'-'+s.dmg:'闪避',s.hit?(s.crit?'crit':''):'miss');
    if(s.hit)msgs.push(...gainExp(u,t,s.killed));if(s.killed)kills++;
    renderUnits();await sleep(260);
  }
  await sleep(500);ring.remove();board.classList.remove('shake');
  for(const m of msgs)toast(m);
  await finishAction(u,kills>0);
}
function openSpirits(u){
  let h=`<h3>精神指令</h3><p class="sub">${u.pilot}　SP ${u.sp} / ${u.maxSp}　气力 ${u.will}</p>`;
  for(const [k,l] of PILOTS[u.pid].spirits){
    const s=SPIRIT[k],learned=u.spirits.includes(k),on=k!=='气合'&&u.fx[k];
    const dis=!learned||on||u.sp<s.cost||(k==='气合'&&u.will>=150)||(k==='加速'&&!(S.mode==='move'&&S.u===u));
    h+=`<button class="wrow" data-act="usesp" data-k="${k}"${dis?' disabled':''}><span class="wn">${k}${on?'（生效中）':''}${learned?'':`<span class="why">　Lv ${l} 习得</span>`}</span><span class="wp">${s.cost}</span><span class="wm">${s.desc}</span></button>`;
  }
  openSheet(h+`<div class="cmds">${btn('close','完成','alt')}</div>`);
}
function useSpirit(u,k){
  const s=SPIRIT[k];if(u.sp<s.cost)return;
  if(k==='气合'){if(u.will>=150)return;u.will=Math.min(150,u.will+10);}else{if(u.fx[k])return;u.fx[k]=true;}
  u.sp-=s.cost;spiritBurst(u,k);
  if(k==='加速'&&S.mode==='move'&&S.u===u)selectAlly(u);
  renderPanel();openSpirits(u);
}
function openDetail(u){
  const P=PILOTS[u.pid];
  const wl=u.weapons.map(w=>`<div class="dw"><b>${w.name}</b><span>${Math.round(w.power*(u.wmul||1))}</span><span>射程 ${w.min===w.max?w.min:w.min+'–'+w.max}</span><span>EN ${w.en||'—'}</span><span>${w.will?'气力 '+w.will:''}</span></div>`).join('');
  const sp=u.side==='ally'?`<h4>精神</h4><div class="dsp">${P.spirits.map(([n,l])=>`<span class="${u.spirits.includes(n)?'on':''}">${n}${u.spirits.includes(n)?'':' · Lv'+l}</span>`).join('')}</div>`:'';
  openSheet(`<div class="dt"><img class="dtp" alt="" src="${portraitURL(u.pid)}"><img class="dtm" alt="" src="${sprite(u.kind,u.side==='ally'?1:-1,u.prop,240)}">
  <div class="dti"><h3>${u.name}</h3><p class="sub">${u.pilot}　Lv ${u.lv}${u.side==='ally'?`　EXP ${u.exp}/100`:''}</p>
  <div class="dst"><span>HP <b>${u.hp}/${u.maxHp}</b></span><span>EN <b>${u.en}/${u.maxEn}</b></span><span>装甲 <b>${u.armor}</b></span><span>运动性 <b>${u.eva}</b></span><span>移动 <b>${u.move}</b></span><span>气力 <b>${u.will}</b></span></div></div></div>
  <h4>武器</h4>${wl}${sp}<div class="cmds">${btn('close','关闭','alt')}</div>`);
}

function checkAutoEnd(){
  if(G.phase!=='player'||G.over)return;
  const ctx=G;if(G.units.every(u=>u.side!=='ally'||!u.alive||u.acted))setTimeout(()=>{if(G===ctx&&G.phase==='player'&&!G.busy&&!G.over)enemyPhase();},550);
}

/* ---------- 被攻击时的应对 ---------- */
function chooseCounter(e,w,t){
  const g=findGuard(t),dm0=baseDmg(e,w,t,false);
  if(SET.autoCounter){
    if(g&&(dm0>=t.hp||dm0>=t.maxHp*.35))return Promise.resolve({mode:'guard',g});
    return Promise.resolve(null);
  }
  return new Promise(res=>{
    G.pending=res;G.guardCand=g;
    const r=dist(e.x,e.y,t.x,t.y),hr=hitRate(e,w,t,false),dm=dm0;
    const opts=t.weapons.map((cw,i)=>({cw,i})).filter(o=>canUse(t,o.cw)&&inR(o.cw,r)&&!o.cw.map);
    let h=`<h3>敌方来袭</h3><p class="sub">${e.name}（Lv${e.lv}）用「${w.name}」攻击${t.name}</p>
    <div class="threatc"><div><span>命中</span><b>${hr}%</b></div><div><span>预计伤害</span><b class="${dm>=t.hp?'kill':''}">${dm}${dm>=t.hp?' 致命':''}</b></div><div><span>${t.name} HP</span><b>${t.hp}</b></div></div><h4>反击</h4>`;
    if(!opts.length)h+=`<p class="sub">射程内没有能用的武器。</p>`;
    for(const o of opts)h+=`<button class="wrow" data-act="cc" data-m="counter" data-i="${o.i}"><span class="wn">${o.cw.name}</span><span class="wp">${baseDmg(t,o.cw,e,false)}</span><span class="wm">命中 ${hitRate(t,o.cw,e)}%　EN ${o.cw.en||'—'}</span></button>`;
    h+=`<div class="ccx"><button class="wrow" data-act="cc" data-m="defend"><span class="wn">防御</span><span class="wp">${baseDmg(e,w,t,true)}</span><span class="wm">受到伤害减半，不反击</span></button>
    <button class="wrow" data-act="cc" data-m="evade"><span class="wn">回避</span><span class="wp">${hitRate(e,w,t,true)}%</span><span class="wm">对方命中减半，不反击</span></button></div>`;
    if(g)h+=`<button class="wrow guard" data-act="cc" data-m="guard"><span class="wn">援护防御：${g.name}</span><span class="wp">${baseDmg(e,w,g,true)}</span><span class="wm">由相邻的${g.name}以防御姿态代为承受（${g.name} HP ${g.hp}）</span></button>`;
    openSheet(h);
  });
}
function resolveCounter(el){
  const res=G.pending;if(!res)return;G.pending=null;closeSheet();
  const m=el.dataset.m;
  if(m==='counter'){const p=G.cur;res({mode:'counter',w:p.t.weapons[+el.dataset.i]});}else if(m==='guard')res({mode:'guard',g:G.guardCand});else res({mode:m});
}

/* ================= 战斗与回合 ================= */
async function runBattle(a,w,d,ch,opt={}){
  let target=d,cw=null,def=false,eva=false,guard=null;
  if(ch&&ch.mode==='guard'&&ch.g&&ch.g.alive){guard=ch.g;target=guard;def=true;guard.guardUsed=true;}
  else if(ch){if(ch.mode==='counter')cw=ch.w;else if(ch.mode==='defend')def=true;else eva=true;}
  else{cw=bestCounter(target,a);def=!cw;}
  const sup=opt.sup&&opt.sup.u.alive?opt.sup:null;
  const pre={[a.id]:a.hp,[target.id]:target.hp};if(sup)pre[sup.u.id]=sup.u.hp;
  const strikes=[strike(a,w,target,def,eva)];
  if(guard)strikes[0].guardFor=d;
  if(sup&&!strikes[0].killed){const s=strike(sup.u,sup.w,target,false,false);s.support=true;sup.u.supUsed=true;strikes.push(s);}
  const dead=!target.alive;
  if(!dead&&!guard&&cw&&canUse(target,cw)&&inR(cw,dist(a.x,a.y,target.x,target.y))){const s2=strike(target,cw,a,false,false);s2.counter=true;strikes.push(s2);}
  const msgs=[];
  for(const s of strikes)if(s.att.side==='ally'&&s.hit)msgs.push(...gainExp(s.att,s.def,s.killed));
  const quick=!SET.anim||(a.side==='enemy'&&SET.enemyAnim==='quick');
  if(!quick){try{await playBattle(strikes,a,target,pre);}catch(e){console.error(e);await beClose();}}
  else await playQuick(strikes);
  renderUnits();
  for(const m of msgs)toast(m);
  return dead;
}
async function playQuick(strikes){
  for(const s of strikes){
    const el=document.querySelector(`.unit[data-id="${s.att.id}"]`),tg=document.querySelector(`.unit[data-id="${s.def.id}"]`);
    if(s.support)popAt(s.att,'援护','crit');
    if(s.guardFor)popAt(s.def,'援护防御','crit');
    if(el){const dx=Math.sign(s.def.x-s.att.x)*.35,dy=Math.sign(s.def.y-s.att.y)*.35;el.style.transform=`translate(calc(${dx} * var(--cell)),calc(${dy} * var(--cell)))`;el.classList.add('lunge');}
    await sleep(160);
    if(tg&&s.hit)tg.classList.add('hit');
    popAt(s.def,s.hit?(s.crit?'暴击 ':'')+'-'+s.dmg:'闪避',s.hit?(s.crit?'crit':''):'miss');
    await sleep(140);if(el){el.style.transform='';el.classList.remove('lunge');}
    renderUnits();await sleep(380);if(tg)tg.classList.remove('hit');
  }
}
function place(tk,x,y,o){for(let r=0;r<10;r++)for(let yy=0;yy<ROWS;yy++)for(let xx=0;xx<COLS;xx++)if(dist(x,y,xx,yy)===r&&!unitAt(xx,yy)){if(ter(xx,yy).cost<99)return mk(tk,'enemy',xx,yy,o);}}
async function spawn(list){for(const [tk,x,y,o] of list){const u=place(tk,x,y,Object.assign({wake:true},o||{}));if(u)u.warpin=true;}renderUnits();await sleep(650);}
async function retreat(u){if(!u)return;u.retreated=true;u.alive=false;renderUnits();await sleep(750);}
async function runEvents(tr){
  for(const ev of G.stage.events||[]){
    if(G.over||G.fired.has(ev.id))continue;
    if(ev.when(tr)){G.fired.add(ev.id);await ev.run();}
  }
}
function loseNow(){return !G.units.some(u=>u.side==='ally'&&u.leader&&u.alive);}
async function afterBattle(){
  renderUnits();
  if(loseNow()){await sleep(500);await defeat();return true;}
  await runEvents('afterBattle');
  if(G.over)return true;
  if(G.stage.win()){await sleep(500);await victory();return true;}
  return false;
}
async function startPlayerPhase(first){
  G.phase='wait';if(!first)G.turn++;
  for(const u of G.units){
    const keep={};for(const k of ['热血','魂','必闪'])if(u.fx[k])keep[k]=true;u.fx=keep;
    if(u.side==='ally'){u.acted=false;u.supUsed=false;u.guardUsed=false;u.reacted=false;if(!first)u.en=Math.min(u.maxEn,u.en+10);}
  }
  updateTop();renderUnits();clearSel();
  await banner(`回合 ${G.turn}`,'我方阶段','ally');
  await runEvents('turnStart');
  if(G.over)return;
  if(G.stage.win()){await victory();return;}
  G.phase='player';updateTop();renderPanel();
}
function aiPlan(e){
  const rm=reachMap(e);let best=null;const allies=G.units.filter(u=>u.alive&&u.side==='ally');
  for(const k of rm.set){const [x,y]=k.split(',').map(Number);
    for(const w of e.weapons){if(!canUse(e,w)||w.map||(w.np&&(x!==e.x||y!==e.y)))continue;
      for(const t of allies){const r=dist(x,y,t.x,t.y);if(!inR(w,r))continue;
        const hr=hitRate(e,w,t),dm=baseDmg(e,w,t,false);
        const cw=t.weapons.some(cw=>canUse(t,cw)&&inR(cw,r)&&!cw.map);
        const s=hr/100*Math.min(dm,t.hp)+(dm>=t.hp?1500*hr/100:0)+(t.leader?220:0)+(cw?0:180)-w.en*3+ter(x,y).eva*4-(x===e.x&&y===e.y?0:5)+(1-t.hp/t.maxHp)*300;
        if(!best||s>best.s)best={s,x,y,w,t,prev:rm.prev};}}}
  if(best)return best;
  let bx=e.x,by=e.y,bd=Infinity;
  for(const k of rm.set){const [x,y]=k.split(',').map(Number);const d=Math.min(...allies.map(t=>dist(x,y,t.x,t.y)))-ter(x,y).eva/100;if(d<bd){bd=d;bx=x;by=y;}}
  return {x:bx,y:by,w:null,t:null,prev:rm.prev};
}
async function enemyPhase(){
  if(G.phase!=='player'||G.over)return;
  G.phase='enemy';closeSheet();clearSel();updateTop();renderPanel();
  await banner('敌方阶段','黑曜军团开始行动','enemy');
  for(const e of G.units)if(e.alive&&e.side==='enemy'&&!e.wake&&(G.turn>=4||G.units.some(a=>a.alive&&a.side==='ally'&&dist(a.x,a.y,e.x,e.y)<=4))){e.wake=true;e.justWoke=true;}
  for(const e of G.units)if(e.justWoke&&e.alive){e.justWoke=false;popAt(e,'！','crit');}
  const list=G.units.filter(u=>u.alive&&u.side==='enemy'&&u.wake).sort((a,b)=>(a.boss?1:0)-(b.boss?1:0));
  for(const e of list){
    if(!e.alive||G.over)continue;
    e.en=Math.min(e.maxEn,e.en+10);const p=aiPlan(e);setHL({sel:key(e.x,e.y)});
    if(p.x!==e.x||p.y!==e.y){await walk(e,pathTo(p.prev,key(e.x,e.y),key(p.x,p.y)));setHL({sel:key(e.x,e.y)});await sleep(120);}
    if(p.t&&p.t.alive){
      setHL({sel:key(e.x,e.y),tgt:new Set([key(p.t.x,p.t.y)])});G.cur=p;
      const ch=await chooseCounter(e,p.w,p.t);
      await sleep(80);await runBattle(e,p.w,p.t,ch);setHL({});
      if(await afterBattle())return;
    }else await sleep(90);
  }
  setHL({});if(!G.over)await startPlayerPhase(false);
}

  if(SET.boss&&!mine){
    const L=G.units.find(u=>u.leader)||G.units.find(u=>u.side==='ally');
    let spot=null;for(let r=1;r<6&&!spot;r++)for(let y=0;y<ROWS&&!spot;y++)for(let x=0;x<COLS&&!spot;x++)if(dist(x,y,L.x,L.y)===r&&!unitAt(x,y))spot=[x,y];
    if(spot){const u=mk('heiyaoP','ally',spot[0],spot[1]);u.warpin=true;renderUnits();renderPanel();toast('黑曜帝加入我方');}
  }else if(!SET.boss&&mine&&G.phase==='player'&&!G.busy){mine.retreated=true;mine.alive=false;renderUnits();renderPanel();toast('黑曜帝撤出战场');}

const LAYOUT={rot:false,port:false,W:0,H:0,sl:0,sr:0,st:0,sb:0};
function layout(){
  const pw=innerWidth,ph=innerHeight,portrait=ph>pw*1.05,rot=portrait&&SET.rotate!==false;
  const R=document.documentElement;R.classList.toggle('rot',rot);R.classList.toggle('port',portrait&&!rot);
  const W=rot?ph:pw,H=rot?pw:ph;R.style.setProperty('--W',W+'px');R.style.setProperty('--H',H+'px');
  const sp=getComputedStyle($('#safeProbe'));
  Object.assign(LAYOUT,{rot,port:portrait&&!rot,W,H,sl:parseFloat(sp.paddingLeft)||0,sr:parseFloat(sp.paddingRight)||0,st:parseFloat(sp.paddingTop)||0,sb:parseFloat(sp.paddingBottom)||0});
  let cell;
  if(LAYOUT.port){cell=Math.min((W-16)/COLS,(H*.58-16)/ROWS);}
  else{const side=clamp(W*.28,212,300);R.style.setProperty('--side',side+'px');
    cell=Math.min((H-LAYOUT.st-LAYOUT.sb-16)/ROWS,(W-LAYOUT.sl-LAYOUT.sr-side-16)/COLS);}
  R.style.setProperty('--cell',Math.floor(clamp(cell,24,76))+'px');
  if(BE.on)beResize();
}
/* ================= 指令分发 ================= */
function act(a,el){
  if(['stay','cancel','undo','attack','spirit','wait','back','weapon','usesp','go'].includes(a)&&(!G||G.phase!=='player'||G.busy))return;
  const u=S.u;
  switch(a){
    case 'stay':toAction();break;
    case 'cancel':clearSel();break;
    case 'undo':u.x=S.origin.x;u.y=S.origin.y;renderUnits();selectAlly(u);break;
    case 'attack':openWeapons(u);break;
    case 'spirit':openSpirits(u);break;
    case 'detail':openDetail(u);break;
    case 'wait':u.acted=true;clearSel();renderUnits();checkAutoEnd();break;
    case 'back':toAction();break;
    case 'weapon':chooseWeapon(+el.dataset.i);break;
    case 'usesp':useSpirit(u,el.dataset.k);break;
    case 'go':confirmAttack();break;
    case 'cc':resolveCounter(el);break;
    case 'close':if(!G||!G.pending)closeSheet();break;
    case 'goal':openGoal();break;
    case 'settings':openSettings();break;
    case 'set':SET[el.dataset.k]=JSON.parse(el.dataset.v);saveSet();openSettings();if(el.dataset.k==='boss')bossToggled();if(el.dataset.k==='rotate'){layout();if(!G)showTitleScreen();}break;
    case 'danger':if(G){G.danger=!G.danger;updateTop();if(S.mode==='idle')idleHL(S.look?{look:key(S.look.x,S.look.y)}:null);}break;
    case 'next':nextUnit();break;
    case 'mapgo':if(G&&G.phase==='player'&&!G.busy&&S.mode==='mapw')mapAttack();break;
    case 'bossmode':SET.boss=!SET.boss;saveSet();showTitleScreen();break;
    case 'fullscreen':{const r=document.documentElement;Promise.resolve(r.requestFullscreen&&r.requestFullscreen()).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{}).finally(()=>setTimeout(()=>{layout();showTitleScreen();},300));break;}
    case 'quit':openSheet(`<h3>放弃本关？</h3><p>本关的进度不会保存，驾驶员经验会保留。</p><div class="cmds">${btn('quitYes','放弃并返回','red')}${btn('close','继续作战','alt')}</div>`);break;
    case 'quitYes':closeSheet();if(G){syncPilots();persist();G.over=true;}showTitleScreen();break;
    case 'end':if(G&&G.phase==='player'&&!G.busy){closeSheet();enemyPhase();}break;
    case 'newgame':SAVE=newSave();persist();startChapter(0);break;
    case 'continue':if(SAVE.chapter>0)showInter();else startChapter(0);break;
    case 'retry':startChapter(G.ci);break;
    case 'inter':showInter();break;
    case 'itab':S.inter=el.dataset.k;showInter();break;
    case 'up':{const k=el.dataset.k,up=SAVE.up[S.inter],cost=UPC[up[k]];if(cost&&SAVE.funds>=cost){SAVE.funds-=cost;up[k]++;persist();showInter();}break;}
    case 'sortie':startChapter(SAVE.chapter);break;
    case 'ending':showEnding();break;
    case 'totitle':showTitleScreen();break;
  }
}

 */
const EDITION={version:'1.0.1',screen:'title',previewRAF:0,previewActor:null,galleryWeapon:1,galleryMiss:false,galleryKill:false,storage:true};

function storageRemove(k){try{localStorage.removeItem(k);}catch(e){}}
function rollbackMove(){if(S.u&&S.origin&&!S.u.acted&&['action','target','mapw'].includes(S.mode)){S.u.x=S.origin.x;S.u.y=S.origin.y;}}
function packSnapshot(){
 if(!G||G.over||G.busy||G.phase!=='player'||G.pending)return null;
 const units=G.units.map(u=>{const v=JSON.parse(JSON.stringify(u));delete v.weapons;
  if(S.u===u&&S.origin&&['action','target','mapw'].includes(S.mode)&&!u.acted){v.x=S.origin.x;v.y=S.origin.y;}

}
let SESSION_SNAPSHOT=null;
function saveSnapshot(){const snap=packSnapshot();if(!snap)return;SESSION_SNAPSHOT=snap;
 try{localStorage.setItem(SNAP_KEY,JSON.stringify(snap));}catch(e){} }
function validateSnapshot(raw){
 if(!raw||raw.version!==1||!Number.isInteger(raw.ci)||!STAGES[raw.ci]||!Array.isArray(raw.units)||raw.units.length<2||raw.units.length>80)return null;
 if(!Number.isInteger(raw.turn)||raw.turn<1||raw.turn>999)return null;
 const ids=new Set(),occupied=new Set();let hero=false;
 for(const u of raw.units){
  if(!Object.prototype.hasOwnProperty.call(TPL,u.tk)||!['ally','enemy'].includes(u.side)||!Number.isInteger(u.id)||u.id<1||ids.has(u.id))return null;ids.add(u.id);
  if(!Number.isInteger(u.x)||!Number.isInteger(u.y)||u.x<0||u.x>=COLS||u.y<0||u.y>=ROWS||STAGES[raw.ci].map[u.y][u.x]==='X')return null;
  if(u.alive){const k=key(u.x,u.y);if(occupied.has(k))return null;occupied.add(k);}
  for(const p of ['hp','maxHp','en','maxEn','sp','maxSp','will','lv','armor','eva','hit'])if(!Number.isFinite(u[p])||u[p]<0||u[p]>1000000)return null;
  if(u.hp>u.maxHp||u.en>u.maxEn||u.sp>u.maxSp||u.lv<1||u.lv>99||u.will>150||u.will<50)return null;
  if(u.maxHp<=0||typeof u.alive!=='boolean'||typeof u.acted!=='boolean')return null;
  // Imported saves never supply executable labels or unchecked UI/stat values.
  for(const p of ['exp','kills','_syncedKills','hold'])u[p]=clamp(Math.floor(Number(u[p])||0),0,p==='exp'?99:99999);
  u.wmul=Number.isFinite(u.wmul)?clamp(u.wmul,.1,10):1;
  for(const p of ['wake','reacted','supUsed','guardUsed','retreated'])u[p]=u[p]===true;
  if(u.tk==='mingsun'&&u.side==='ally'&&u.alive&&u.hp>0)hero=true;
 }
 if(!hero)return null;
 raw.flags=raw.flags&&typeof raw.flags==='object'?Object.fromEntries(Object.entries(raw.flags).filter(([k,v])=>/^[\w-]{1,40}$/.test(k)&&typeof v==='boolean')):{};
 raw.fired=Array.isArray(raw.fired)?raw.fired.filter(id=>STAGES[raw.ci].events.some(e=>e.id===id)):[];
 raw.funds=clamp(Math.floor(Number(raw.funds)||0),0,9999999);
 raw.stats={kills:clamp(Number(raw.stats?.kills)||0,0,9999),lost:clamp(Number(raw.stats?.lost)||0,0,9999)};
 return raw;
}
function readSnapshot(){try{const s=validateSnapshot(SESSION_SNAPSHOT||JSON.parse(localStorage.getItem(SNAP_KEY)||'null'));return s&&SAVE&&!SAVE.done&&s.ci===SAVE.chapter?s:null;}catch(e){return null;}}
function clearSnapshot(){SESSION_SNAPSHOT=null;storageRemove(SNAP_KEY);}
