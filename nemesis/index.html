const _baseDamage=baseDmg,_baseHit=hitRate;
baseDmg=function(a,w,d,def){const v=_baseDamage(a,w,d,def);return SET.diff==='hard'?Math.max(10,Math.round(v*(a.side==='enemy'?1.12:.95)/10)*10):v;};
hitRate=function(a,w,d,ev){const h=_baseHit(a,w,d,ev);if(SET.diff!=='hard'||d.fx['必闪']||a.fx['必中'])return h;return clamp(h+(a.side==='enemy'?5:-3),0,100);};
// Exact threatened cells respect minimum range, EN and stationary-only weapons.
threat=function(u){const s=new Set(),reachable=reachMap(u).set;
 for(const k of reachable){const [x,y]=k.split(',').map(Number);
  for(const w of u.weapons){if(!canUse(u,w)||(w.np&&(x!==u.x||y!==u.y)))continue;
   for(let yy=0;yy<ROWS;yy++)for(let xx=0;xx<COLS;xx++)if(ter(xx,yy).cost<99&&(w.map?dist(x,y,xx,yy)<=w.map:inR(w,dist(x,y,xx,yy))))s.add(key(xx,yy));}}
 return s;};
function commitRelay(u){if(!G||!u?.alive||u.side!=='ally')return;
 for(const r of G.stage.relays||[])if(u.x===r.x&&u.y===r.y&&!G.flags[r.id]){G.flags[r.id]=true;popAt(u,'中继已接通','crit');audioFx('spirit');toast(r.name+'已接通');}}
syncPilots=function(){if(!G||!SAVE)return;for(const u of G.units)if(u.side==='ally'&&SAVE.pilots[u.tk]){const p=SAVE.pilots[u.tk];p.lv=u.lv;p.exp=u.exp;p.kills=(p.kills||0)+Math.max(0,u.kills-(u._syncedKills||0));u._syncedKills=u.kills;}};
const _startPlayer=startPlayerPhase;
startPlayerPhase=async function(first){
 if(!first)for(const u of G.units)if(u.alive&&u.side==='ally'&&MAP[u.y][u.x]==='S'){u.hp=Math.min(u.maxHp,u.hp+Math.round(u.maxHp*.1));u.en=Math.min(u.maxEn,u.en+20);}
 audioFx('phase');await _startPlayer(first);saveSnapshot();};

// One MAP attack consumes EN / offensive spirits once; every target gets the same starting multiplier.
mapAttack=async function(){
 const u=S.u,w=S.w;if(!u||!w?.map||!usableNow(u,w))return;const targets=mapTargets(u,w);if(!targets.length)return;
 G.busy=true;closeSheet();updateTop();setHL({});u.en-=w.en;const fx={...u.fx},will=u.will;let willGain=0,kills=0;const msgs=[];
 audioFx('charge');await banner(w.name,'六基浮游炮：区域封锁已建立',u.side);
 const ring=document.createElement('div');ring.className='mapring';ring.style.setProperty('--x',u.x);ring.style.setProperty('--y',u.y);ring.style.setProperty('--r',w.map);$('#board').appendChild(ring);
 await sleep(450);audioFx('rifle');
 for(const t of targets){u.fx={...fx};u.will=will;const r=strike(u,{...w,en:0},t,false,false);willGain+=u.will-will;
  popAt(t,r.hit?(r.crit?'暴击 ':'')+'−'+r.dmg:'闪避',r.crit?'crit':'');if(r.hit)msgs.push(...gainExp(u,t,r.killed));if(r.killed)kills++;renderUnits();await sleep(180);}
 u.will=Math.min(150,will+willGain);u.fx={...fx};delete u.fx['热血'];delete u.fx['魂'];audioFx('burst');await sleep(400);ring.remove();msgs.forEach(toast);await finishAction(u,kills>0);
};

 for(let y=0;y<640;y++)for(let x=0;x<640;x++)if(pix[(y*640+x)*4+3]>45){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}

  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);

  c.save();c.translate(cx,cy);c.rotate(ts*.000022);c.strokeStyle='#9faed250';c.setLineDash([2,16]);c.beginPath();c.arc(0,0,Math.min(w*.38,h*.42),0,Math.PI*2);c.stroke();c.restore();
  c.fillStyle='#adbbd1';c.font='10px monospace';c.textAlign='left';c.fillText('J-01 / NEMESIS',24,30);c.fillStyle='#607186';c.fillText('HIGH-MOBILITY HEAVY ASSAULT',24,46);
  c.fillStyle='#7c91ac';c.textAlign='right';c.fillText('REMOTE DRONE ARRAY : 06',w-20,h-23);
  const padTop=LAYOUT.H<560?30:52,padBottom=LAYOUT.H<560?45:75;const scale=Math.min((w-40)/bb.w,(h-padTop-padBottom)/bb.h);c.save();c.translate(w*.51-bb.x*scale,(padTop+h-padBottom)/2-bb.y*scale+(SET.reducedFx?0:Math.sin(ts*.0015)*2));c.scale(scale,scale);

 };EDITION.previewRAF=requestAnimationFrame(draw);

openGoal=function(){if(!G)return;openSheet(`<div class="eyebrow">MISSION BRIEFING</div><h3>${G.stage.ch} · ${G.stage.name}</h3><div class="goal-block"><p><b class="win">胜利</b>　${G.stage.goal}</p><p><b class="lose">失败</b>　冥隼被击破</p><p><b class="hot">熟练度</b>　${G.stage.sr.text}（奖励 ${prettyN(G.stage.sr.reward)}）</p></div>
 <h4>行动流程</h4><p>点击蓝环机体 → 蓝格移动 → 攻击 / 精神 / 待机。也可点「原地行动」使用火箭炮或 MAP 武器。移动可以取消，攻击与待机后提交行动。</p>
 <h4>冥隼的七种武装</h4><p>光束步枪覆盖 1–5 格；斩舰刀适合近战。火箭炮与 MAP 封锁阵移动后不可用。气力 110 开启六翼，125 开启零界斩。击破后的再动每回合一次。</p>
 <h4>援护与回复</h4><p>队友相邻 1 格可发动援护攻击，每机每回合一次。玄武能援护防御。站在「＋」中继站上，下一我方回合回复 10% HP 与总计 30 EN；其他地形每回合回复 10 EN。</p>
 ${G.stage.relays?'<p><b>本关中继：</b>在两座中继站分别完成一次行动，即使离开也会保持接通。移动后取消不算接通。</p>':''}
 <h4>战斗预测与存档</h4><p>伤害预测为基准值，实际有 ±8% 波动，暴击为 1.5 倍。每次完成行动与我方阶段开始时自动保存；尚未提交的移动在读档时回到原位。</p><div class="cmds">${btn('close','返回战场','primary')}</div>`);};
openSettings=function(){const active=G&&!G.over;
 openSheet(`<div class="eyebrow">SYSTEM CONFIGURATION</div><h3>系统设置</h3>
 <div class="setrow"><span>难度</span><div class="seg">${segBtn('diff','easy','轻松')}${segBtn('diff','normal','标准')}${segBtn('diff','hard','挑战')}</div></div>
 <div class="setrow"><span>战斗演出</span><div class="seg">${segBtn('anim',true,'开启')}${segBtn('anim',false,'快速结算')}</div></div>
 <div class="setrow"><span>敌方演出</span><div class="seg">${segBtn('enemyAnim','quick','快速')}${segBtn('enemyAnim','full','完整')}</div></div>
 <div class="setrow"><span>演出速度</span><div class="seg">${[1,1.5,2].map(v=>segBtn('speed',v,v+'×')).join('')}</div></div>
 <div class="setrow"><span>反击选择</span><div class="seg">${segBtn('autoCounter',true,'自动')}${segBtn('autoCounter',false,'手动')}</div></div>
 <div class="setrow"><span>合成音效</span><div class="seg">${segBtn('sfx',true,'开启')}${segBtn('sfx',false,'关闭')}</div></div>
 <div class="setrow"><span>背景音序</span><div class="seg">${segBtn('bgm',true,'开启')}${segBtn('bgm',false,'关闭')}</div></div>
 <div class="setrow"><span>闪光 / 震屏</span><div class="seg">${segBtn('reducedFx',false,'标准')}${segBtn('reducedFx',true,'减弱')}</div></div>
 <div class="setrow"><span>手机竖握</span><div class="seg">${segBtn('rotate',true,'画面横置')}${segBtn('rotate',false,'上下布局')}</div></div>
 <p class="sub">轻松：友军伤害 +10%，敌军 −20%；挑战：友军 −5%，敌军 +12%。切换立即生效。声音需要一次触摸后启动。</p>
 <div class="cmds">${btn('export','导出存档','alt')}${!active?btn('import','导入存档','alt'):btn('savequit','保存并返回标题','alt',G.phase!=='player'||G.busy)}${btn('close','完成','primary')}</div><p class="sub">${EDITION.storage?'存档保存在当前浏览器，不会上传。':'此环境无法持久保存；请导出 JSON 备份。'} 未提交的移动会回到原位。</p>`);
};

/* ----- Responsive layout ----- */
layout=function(){
 const pw=innerWidth,ph=innerHeight,portrait=ph>pw*1.05,rot=portrait&&SET.rotate!==false,R=document.documentElement;
 R.classList.toggle('rot',rot);R.classList.toggle('port',portrait&&!rot);
 const W=rot?ph:pw,H=rot?pw:ph;R.style.setProperty('--W',W+'px');R.style.setProperty('--H',H+'px');
 const sp=getComputedStyle($('#safeProbe'));Object.assign(LAYOUT,{rot,port:portrait&&!rot,W,H,sl:parseFloat(sp.paddingLeft)||0,sr:parseFloat(sp.paddingRight)||0,st:parseFloat(sp.paddingTop)||0,sb:parseFloat(sp.paddingBottom)||0});
 R.classList.toggle('compact',H<560&&!LAYOUT.port);let cell;
 if(LAYOUT.port)cell=Math.min((W-24)/COLS,(H*.48-44)/ROWS);
 else{const side=clamp(W*.265,210,322);R.style.setProperty('--side',side+'px');cell=Math.min((H-LAYOUT.st-LAYOUT.sb-76)/ROWS,(W-LAYOUT.sl-LAYOUT.sr-side-36)/COLS);}
 R.style.setProperty('--cell',Math.floor(clamp(cell,18,86))+'px');if(BE.on)beResize();
};

/* ----- Actions ----- */
const _act=act;
act=function(a,el={dataset:{}}){
 audioInit();if(a!=='gplay')audioFx('click');
 if(BE.on&&!['cc'].includes(a))return;
 if(G&&!G.over&&(G.busy||G.phase!=='player')&&['newgame','newgameConfirm','totitle','continue','sortie','retry','gallery','quit','quitYes','savequit','import','end'].includes(a))return;
 switch(a){
  case 'gallery':G=null;closeSheet();showGallery();return;
  case 'gweapon':EDITION.galleryWeapon=clamp(+el.dataset.i,0,6);showGallery();return;
  case 'gmiss':EDITION.galleryMiss=!EDITION.galleryMiss;showGallery();return;
  case 'gkill':EDITION.galleryKill=!EDITION.galleryKill;showGallery();return;
  case 'gplay':playGallery();return;
  case 'dossier':openDossier();return;
  case 'export':exportSave();return;
  case 'import':importSave();return;
  case 'continue':{const s=readSnapshot();if(s&&resumeSnapshot(s))return;if(SAVE?.done){showEnding();return;}if(SAVE?.chapter>0)showInter();else startChapter(0);return;}
  case 'newgame':if(SAVE&&!SAVE.done){openSheet(`<h3>开始新的战役？</h3><p>现有章节、改造和战场存档将被替换。可先在系统设置中导出备份。</p><div class="cmds">${btn('newgameConfirm','开始新战役','primary')}${btn('close','取消','alt')}</div>`);return;}
  case 'newgameConfirm':SAVE=newSave();persist();clearSnapshot();startChapter(0);return;
  case 'wait':if(G&&G.phase==='player'&&!G.busy&&S.u&&!S.u.acted){G.busy=true;finishAction(S.u,false);}return;
  case 'savequit':case 'quit':case 'quitYes':if(G&&G.phase==='player'&&!G.busy&&!G.pending){saveSnapshot();closeSheet();showTitleScreen();}return;
  case 'totitle':if(G&&!G.over){if(G.phase==='player'&&!G.busy)saveSnapshot();else return;}showTitleScreen();return;
  case 'set':{const k=el.dataset.k;let v;try{v=JSON.parse(el.dataset.v);}catch(e){return;}
   if(!(k in SET)||typeof v!==typeof SET[k])return;SET[k]=v;saveSet();audioMusic();if(k==='rotate')layout();document.documentElement.classList.toggle('low-fx',SET.reducedFx);openSettings();return;}
  case 'fullscreen':{document.documentElement.requestFullscreen?.().catch(()=>{});return;}
  case 'end':if(G&&G.phase==='player'&&!G.busy){const n=G.units.filter(u=>u.alive&&u.side==='ally'&&!u.acted).length;
   if(n){openSheet(`<h3>结束我方阶段？</h3><p>还有 ${n} 台机体尚未行动。未提交的移动会回到原位。</p><div class="cmds">${btn('endConfirm','结束阶段','primary')}${btn('close','继续行动','alt')}</div>`);}else enemyPhase();}return;
  case 'endConfirm':if(G&&G.phase==='player'&&!G.busy){closeSheet();enemyPhase();}return;
 }
 _act(a,el);
};
// Header / legend are outside the selectable grid, so no combat cells are obscured.
$('#wrap').insertAdjacentHTML('afterbegin','<div class="map-header"><span id="mapLocation">天穹轨道港</span><small id="mapCount">TACTICAL GRID</small></div>');
$('#wrap').insertAdjacentHTML('beforeend','<div class="map-legend"><span><i class="blue"></i>可移动</span><span><i class="red"></i>攻击范围</span><span><i class="relay"></i>中继站</span><small>冥隼被击破即任务失败</small></div>');
$('#bskip').setAttribute('aria-label','加速至本次演出结束');
document.documentElement.classList.toggle('low-fx',SET.reducedFx);
addEventListener('pagehide',saveSnapshot);
/* ================= 绑定 ================= */
buildTiles();layout();
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,250));
$('#tiles').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;const i=+t.dataset.i;onTile(i%COLS,Math.floor(i/COLS));});
addEventListener('keydown',e=>{if(e.key==='Escape'&&G&&!G.busy){if(!$('#sheet').classList.contains('hidden')){if(!G.pending)closeSheet();}else if(S.mode==='target')toAction();else if(S.mode==='action')act('undo');else clearSel();}});
for(const id of ['#panel','#sheet','#top','#endbar','#screen'])$(id).addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b);});
$('#sheetBack').addEventListener('click',()=>{if(!G||!G.pending)closeSheet();});
$('#battle').addEventListener('pointerdown',e=>{if(e.target.id==='bskip')return;BE.speed=Math.max(BE.speed,2.4*(SET.speed||1));});
$('#bskip').addEventListener('click',e=>{e.stopPropagation();BE.speed=14;});
document.addEventListener('visibilitychange',()=>{BE.last=0;});

updateTop();renderPanel();showTitleScreen();

if(window.__nemesisReady)window.__nemesisReady();
</script>
</body>
